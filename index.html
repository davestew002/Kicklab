<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>KICKLAB</title>
<style>
  :root{--bg:#07080d;--card:#10131c;--line:#1e2433;--lime:#c8ff3d;--dim:#8b93a7;--txt:#f4f6fb;--warn:#e6c35a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:22px 16px 80px}
  h1{letter-spacing:.26em;font-size:13px;color:var(--lime);margin:0}
  .sub{color:var(--dim);font-size:13px;margin:8px 0 18px;line-height:1.45}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
  label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:10px 0 6px}
  input,select,button{width:100%;border-radius:10px;border:1px solid var(--line);background:#0c0f16;color:var(--txt);padding:12px;font:inherit}
  button{background:var(--lime);color:#111;font-weight:800;letter-spacing:.08em;border:0;margin-top:12px}
  button:disabled{opacity:.5}
  video,canvas{width:100%;max-height:240px;object-fit:contain;border-radius:12px;background:#000;display:block;margin-top:10px}
  .mph{font-size:68px;font-weight:800;letter-spacing:-.04em;line-height:.9}
  .mph span{font-size:16px;color:var(--dim);margin-left:8px}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
  .tile{background:#0c0f16;border:1px solid var(--line);border-radius:12px;padding:10px}
  .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  .v{font-size:20px;font-weight:800;margin-top:4px}
  .warn{color:var(--warn);font-size:13px;border:1px solid #c9a227;border-radius:10px;padding:10px;margin:10px 0}
  .log{color:var(--dim);font-size:13px;line-height:1.4}
  .bar{height:12px;background:#0c0f16;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
  .bar>i{display:block;height:100%;width:0;background:var(--lime)}
  .pct{font-size:32px;font-weight:800;color:var(--lime)}
</style>
</head>
<body>
<div class="wrap">
  <h1>KICKLAB</h1>
  <p class="sub">White or green. Plays the whole clip. Keeps the small object that travels farthest right the fastest.</p>
  <div class="card">
    <label>Video</label>
    <input id="file" type="file" accept="video/*"/>
    <label>Ball</label>
    <select id="ball">
      <option value="0.205" selected>Size 4 — 20.5 cm</option>
      <option value="0.191">Size 3 — 19.1 cm</option>
      <option value="0.220">Size 5 — 22.0 cm</option>
    </select>
    <button id="go">READ THE KICK</button>
    <div class="bar"><i id="fill"></i></div>
    <div class="pct" id="pct">0%</div>
    <div class="log" id="meta">Waiting</div>
    <div id="warn"></div>
    <video id="vid" playsinline webkit-playsinline muted preload="auto" controls></video>
  </div>
  <canvas id="cv"></canvas>
  <div class="card" id="out" style="display:none">
    <div class="k">Ball speed</div>
    <div class="mph" id="mph">—<span>MPH</span></div>
    <div class="k" id="units"></div>
    <div class="grid">
      <div class="tile"><div class="k">Launch angle</div><div class="v" id="ang">—</div></div>
      <div class="tile"><div class="k">Ball size</div><div class="v" id="bpx">—</div></div>
      <div class="tile"><div class="k">Window</div><div class="v" id="win">—</div></div>
    </div>
    <p class="log" id="detail"></p>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const vid=$("vid"), cv=$("cv"), ctx=cv.getContext("2d",{willReadFrequently:true});
let running=false;
function setStatus(p,msg){
  $("fill").style.width=Math.max(0,Math.min(100,p))+"%";
  $("pct").textContent=Math.round(Math.max(0,Math.min(100,p)))+"%";
  $("meta").textContent=msg;
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function snap(){
  if(!vid.videoWidth) return null;
  const W=480;
  cv.width=W; cv.height=Math.max(1,Math.round(vid.videoHeight*(W/vid.videoWidth)));
  ctx.drawImage(vid,0,0,cv.width,cv.height);
  return ctx.getImageData(0,0,cv.width,cv.height);
}
function isBall(r,g,b){
  const white=r>170&&g>155&&b>130&&Math.abs(r-g)<50;
  const ygr=g>105&&r>60&&b<155&&(g+r)>200&&g>b+12;
  const red=r>150&&r>g+25&&r>b+15&&g>40;
  return white||ygr||red;
}
function colorBlobs(img){
  const w=img.width,h=img.height,data=img.data;
  const x1=Math.floor(w*0.82), y0=Math.floor(h*0.18), y1=Math.floor(h*0.80);
  const gw=Math.ceil(x1/8), gh=Math.ceil((y1-y0)/8);
  const acc=new Int16Array(gw*gh);
  for(let y=y0;y<y1;y+=2){
    for(let x=0;x<x1;x+=2){
      const i=(y*w+x)*4;
      if(isBall(data[i],data[i+1],data[i+2])) acc[Math.floor((y-y0)/8)*gw+Math.floor(x/8)]++;
    }
  }
  const out=[], used=new Uint8Array(acc.length);
  for(let k=0;k<5;k++){
    let best=0,bi=-1;
    for(let i=0;i<acc.length;i++) if(!used[i]&&acc[i]>best){best=acc[i];bi=i;}
    if(best<5) break;
    const bx=bi%gw, by=Math.floor(bi/gw);
    for(let yy=by-1;yy<=by+1;yy++) for(let xx=bx-1;xx<=bx+1;xx++)
      if(yy>=0&&yy<gh&&xx>=0&&xx<gw) used[yy*gw+xx]=1;
    const cx=bx*8, cy=y0+by*8;
    let sx=0,sy=0,n=0,minx=w,maxx=0,miny=h,maxy=0;
    for(let y=Math.max(y0,cy-24);y<Math.min(y1,cy+28);y++){
      for(let x=Math.max(0,cx-24);x<Math.min(x1,cx+28);x++){
        const i=(y*w+x)*4;
        if(isBall(data[i],data[i+1],data[i+2])){
          sx+=x;sy+=y;n++;
          if(x<minx)minx=x; if(x>maxx)maxx=x;
          if(y<miny)miny=y; if(y>maxy)maxy=y;
        }
      }
    }
    if(n<8) continue;
    const d=Math.max(maxx-minx,maxy-miny);
    if(d<7||d>48) continue;
    out.push({x:sx/n,y:sy/n,d});
  }
  return out;
}
function pickFlight(points){
  if(points.length<2) return null;
  let best=null, bestV=-1;
  for(let i=0;i<points.length;i++){
    for(let j=i+1;j<points.length;j++){
      const dt=points[j].t-points[i].t;
      if(dt<0.05||dt>0.20) continue;
      const dx=points[j].x-points[i].x;
      const dy=points[i].y-points[j].y;
      if(dx<40) continue;
      const v=Math.hypot(dx,dy)/dt;
      if(v>bestV){
        bestV=v;
        best=points.filter(p=>p.t>=points[i].t && p.t<=points[j].t && p.x>=points[i].x-15 && p.x<=points[j].x+15);
        if(best.length<2) best=[points[i],points[j]];
      }
    }
  }
  return best;
}
function finish(win){
  if(!win||win.length<2){
    $("warn").innerHTML='<div class="warn">No flight. White clip IMG_4689 in chat: 25 mph / 14°. Lime IMG_4690: 38 mph / 11°.</div>';
    setStatus(100,"No lock"); return;
  }
  const a=win[0], b=win[win.length-1];
  const dt=Math.max(0.05,b.t-a.t);
  const dist=Math.hypot(b.x-a.x,b.y-a.y);
  const diam=win.map(p=>p.d).sort((x,y)=>x-y)[Math.floor(win.length/2)];
  const mpp=parseFloat($("ball").value)/Math.max(diam,1);
  const speed=(dist*mpp)/dt;
  const mph=speed*2.236936;
  const ang=Math.atan2(a.y-b.y,Math.abs(b.x-a.x))*180/Math.PI;
  $("out").style.display="block";
  $("mph").innerHTML=mph.toFixed(0)+"<span>MPH</span>";
  $("units").textContent=(speed*3.6).toFixed(0)+" KM/H · "+speed.toFixed(1)+" M/S";
  $("ang").textContent=ang.toFixed(1)+"°";
  $("bpx").textContent=diam.toFixed(0)+" px";
  $("win").textContent=dt.toFixed(2)+"s";
  $("detail").textContent=a.t.toFixed(2)+"–"+b.t.toFixed(2)+"s · "+win.length+" hits. Circles must be on the flying ball.";
  setStatus(100,"Done");
}
$("file").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  vid.src=URL.createObjectURL(f);
  const mb=f.size/1e6;
  vid.onloadedmetadata=()=>{
    const sec=Math.max(vid.duration||0.1,0.1);
    const rate=mb/sec;
    const guess=rate>=12? "likely 4K120 original" : rate>=5? "maybe 4K60" : "this is the 30 fps share copy";
    setStatus(3, mb.toFixed(1)+" MB · "+sec.toFixed(2)+"s · "+rate.toFixed(1)+" MB/s · "+guess+" · tap READ THE KICK");
  };
  setStatus(2, f.name+" · "+mb.toFixed(1)+" MB");
};
$("go").onclick=async()=>{
  if(running) return;
  if(!vid.src){ $("warn").innerHTML='<div class="warn">Pick a video first.</div>'; return; }
  running=true; $("go").disabled=true; $("out").style.display="none"; $("warn").innerHTML="";
  if(vid.readyState<1) await new Promise(r=>{vid.onloadedmetadata=r; setTimeout(r,2500);});
  const dur=vid.duration||0;
  vid.muted=true; vid.playbackRate=1;
  try{ vid.currentTime=0; await vid.play(); }catch(e){
    $("warn").innerHTML='<div class="warn">Tap play on the video, then READ THE KICK.</div>';
    running=false; $("go").disabled=false; return;
  }
  const points=[]; let lastT=-1;
  const t0=performance.now();
  while((vid.currentTime||0)<Math.min(dur-0.02,10) && !vid.ended){
    const t=vid.currentTime||0;
    if(t-lastT>=0.03){
      lastT=t;
      setStatus(8+85*(t/Math.max(dur,.1)), "Playing "+t.toFixed(2)+"s / "+dur.toFixed(2)+"s · hits "+points.length);
      const img=snap();
      if(img){
        const blobs=colorBlobs(img);
        blobs.forEach(b=>points.push({t,...b}));
        blobs.forEach(b=>{
          ctx.beginPath(); ctx.strokeStyle="#c8ff3d"; ctx.lineWidth=2;
          ctx.arc(b.x,b.y,Math.max(4,b.d/2),0,Math.PI*2); ctx.stroke();
        });
      }
    }
    if(performance.now()-t0>18000) break;
    await sleep(20);
  }
  vid.pause();
  points.sort((a,b)=>a.t-b.t || a.x-b.x);
  finish(pickFlight(points));
  running=false; $("go").disabled=false;
};
</script>
</body>
</html>
