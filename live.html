<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<title>KICKLAB LIVE</title>
<style>
  :root{--lime:#c8ff3d;--pink:#ff2ec8;--txt:#f4f6fb}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#05070c;color:var(--txt);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}
  #stage{position:fixed;inset:0;z-index:1;touch-action:none}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  video{z-index:1;transform:scaleX(-1)}
  canvas{z-index:2}
  #hud{position:fixed;inset:0;z-index:3;pointer-events:none}
  #hud *{pointer-events:auto}
  .top{position:absolute;top:calc(6px + env(safe-area-inset-top));left:10px;right:10px}
  .brand{letter-spacing:.28em;font-size:10px;color:var(--lime);font-weight:700}
  .panel{background:rgba(8,10,16,.8);border:1px solid #2a3348;border-radius:14px;padding:8px 10px;margin-top:6px;backdrop-filter:blur(10px);max-width:56vw}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
  select,button{border:0;border-radius:10px;padding:8px 10px;font:inherit;font-weight:800}
  select{background:#0c0f16;color:var(--txt);border:1px solid #2a3348;font-weight:600}
  .go{background:var(--lime);color:#111}
  .ghost{background:#0c0f16;color:var(--txt);border:1px solid #2a3348}
  .prompt{margin-top:6px;font-size:15px;font-weight:800;letter-spacing:.04em;color:var(--lime)}
  .mphwrap{position:absolute;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));text-align:right;pointer-events:none}
  .mph{font-size:84px;font-weight:800;letter-spacing:-.06em;line-height:.85;text-shadow:0 8px 30px #000}
  .mph span{font-size:16px;color:var(--lime);margin-left:6px}
  .arrow{font-size:90px;line-height:.65}
  .up{color:#7dff6a}.down{color:#ff4d4d}.same{color:#e6c35a}
  .sub{color:#d7dce8;font-size:13px}
</style>
</head>
<body>
<div id="stage">
  <video id="vid" playsinline muted autoplay></video>
  <canvas id="cv"></canvas>
</div>
<div id="hud">
  <div class="top">
    <div class="brand">KICKLAB LIVE</div>
    <div class="panel">
      <div class="row">
        <select id="size"><option value="0.205" selected>Size 4</option></select>
        <button class="ghost" id="cam">START CAMERA</button>
        <button class="ghost" id="lock">LOCK</button>
        <button class="ghost" id="unlock">RECALIBRATE</button>
      </div>
      <div class="prompt" id="prompt">START CAMERA · put the ball in the pink ring</div>
    </div>
  </div>
  <div class="mphwrap">
    <div class="arrow same" id="arrow">→</div>
    <div class="mph" id="mph">—<span>MPH</span></div>
    <div class="sub" id="meta">Size 4 ball is the ruler</div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const vid = $("vid");
const cv = $("cv");
const ctx = cv.getContext("2d", { willReadFrequently: true });

const BALL_FT = 0.673;          // size 4 diameter in feet
const RING_R  = 0.042;          // ring radius as fraction of frame width
const PINK    = "#ff2ec8";

const S = {
  live: false,
  phase: "off",                 // off | seek | mark | fly | done
  cx: 0.74, cy: 0.68, r: RING_R,
  gx: 0.22,
  drag: false,
  quietUntil: 0,
  lastY: 0,
  still: 0,
  mark: null,                   // {x,y,d,t} ball at rest
  ball: null,                   // last seen {x,y,d}
  path: [],                     // flight samples {t,x,y}
  lastMph: null,
  flyStart: 0,
  vx: 0,
  vy: 0,
  miss: 0
};

const analyze = document.createElement("canvas");
const actx = analyze.getContext("2d", { willReadFrequently: true });

function resize(){
  cv.width  = innerWidth  * devicePixelRatio;
  cv.height = innerHeight * devicePixelRatio;
}
addEventListener("resize", resize);
resize();

function say(t){ $("prompt").textContent = t; }

function resetSeek(){
  S.phase = S.live ? "seek" : "off";
  S.still = 0;
  S.mark = null;
  S.ball = null;
  S.path = [];
  S.flyStart = 0;
  $("lock").className = "ghost";
}

function drawCover(c, video, W, H, mirror){
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return;
  const scale = Math.max(W / vw, H / vh);
  const dw = vw * scale, dh = vh * scale;
  const ox = (W - dw) / 2, oy = (H - dh) / 2;
  c.save();
  if (mirror){
    c.translate(W, 0);
    c.scale(-1, 1);
    c.drawImage(video, W - ox - dw, oy, dw, dh);
  } else {
    c.drawImage(video, ox, oy, dw, dh);
  }
  c.restore();
}

async function startCam(){
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 60 } }
  });
  vid.srcObject = stream;
  await vid.play();
  S.live = true;
  S.phase = "seek";
  say("Place the ball in the pink ring and hold still");
  loop();
}

function toNorm(ev){
  const r = cv.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / r.width, y: (ev.clientY - r.top) / r.height };
}
function nearRing(p){
  return Math.hypot(p.x - S.cx, (p.y - S.cy) * 0.6) < S.r * 4;
}
function onDown(ev){
  if (ev.target.closest && ev.target.closest(".panel")) return;
  const p = toNorm(ev.touches ? ev.touches[0] : ev);
  if (!nearRing(p)) return;
  S.drag = true;
  S.lastY = p.y;
  S.phase = "seek";
  S.still = 0;
  S.mark = null;
  S.path = [];
}
function onMove(ev){
  if (!S.drag) return;
  ev.preventDefault();
  const p = toNorm(ev.touches ? ev.touches[0] : ev);
  S.cy = Math.min(0.92, Math.max(0.18, S.cy + (p.y - S.lastY)));
  S.lastY = p.y;
}
function onUp(){
  if (!S.drag) return;
  S.drag = false;
  S.quietUntil = performance.now() + 700;
  S.phase = "seek";
  say("Ring set — ball in the ring, hold still");
}
document.addEventListener("pointerdown", onDown, { passive: false });
document.addEventListener("pointermove", onMove, { passive: false });
document.addEventListener("pointerup", onUp);
document.addEventListener("touchstart", onDown, { passive: false });
document.addEventListener("touchmove", onMove, { passive: false });
document.addEventListener("touchend", onUp);

function isBallPix(r, g, b){
  const grass = g > r + 12 && g > b + 8 && g > 50 && g < 210;
  if (grass) return false;
  const lum = (r + g + b) / 3;
  if (lum > 145) return true;
  if (r > 135 && r > g + 22 && r > b + 12) return true;
  if (lum < 75 && Math.abs(r - g) < 28 && Math.abs(g - b) < 28) return true;
  return lum > 95;
}

function blobIn(img, cx, cy, rad){
  const w = img.width, h = img.height, data = img.data;
  const x0 = Math.max(1, (cx - rad) * w | 0);
  const x1 = Math.min(w - 1, (cx + rad) * w | 0);
  const y0 = Math.max(1, (cy - rad) * h | 0);
  const y1 = Math.min(h - 1, (cy + rad) * h | 0);
  let sx = 0, sy = 0, n = 0, minx = w, maxx = 0, miny = h, maxy = 0;
  for (let y = y0; y < y1; y++){
    for (let x = x0; x < x1; x++){
      if (Math.hypot(x - cx * w, y - cy * h) > rad * w) continue;
      const i = (y * w + x) * 4;
      if (!isBallPix(data[i], data[i + 1], data[i + 2])) continue;
      sx += x; sy += y; n++;
      if (x < minx) minx = x; if (x > maxx) maxx = x;
      if (y < miny) miny = y; if (y > maxy) maxy = y;
    }
  }
  if (n < 18) return null;
  const d = Math.max(4, Math.max(maxx - minx, maxy - miny)) / w;
  if (d < 0.012 || d > 0.12) return null;
  return { x: sx / n / w, y: sy / n / h, d };
}

function inRing(p){
  return Math.hypot(p.x - S.cx, p.y - S.cy) < S.r * 1.25;
}

function scanLane(img, x0, x1, y){
  const dir = x1 < x0 ? -1 : 1;
  let best = null, bestN = 0;
  for (let x = x0; dir < 0 ? x >= x1 : x <= x1; x += 0.05 * dir){
    const hit = blobIn(img, x, y, 0.11);
    if (!hit) continue;
    if (hit.x * dir < x0 * dir - 0.01) continue;
    const n = 1 / (Math.abs(hit.y - y) + 0.02);
    if (n > bestN){ best = hit; bestN = n; }
  }
  return best;
}

function findBall(img){
  if (S.phase === "fly"){
    const ox = S.ball ? S.ball.x : S.cx;
    const oy = S.ball ? S.ball.y : S.cy;
    const px = Math.max(0.05, Math.min(0.95, ox + (S.vx || -0.08)));
    const py = Math.max(0.25, Math.min(0.92, oy + (S.vy || 0.02)));
    let hit = blobIn(img, px, py, 0.13);
    if (hit) return hit;
    hit = blobIn(img, ox - 0.08, oy + 0.04, 0.13);
    if (hit) return hit;
    hit = scanLane(img, ox, S.gx - 0.02, oy + 0.04);
    if (hit) return hit;
    hit = scanLane(img, ox, S.gx - 0.02, S.cy + 0.06);
    if (hit) return hit;
    hit = blobIn(img, S.gx + 0.06, S.cy + 0.05, 0.14);
    if (hit) return hit;
    return null;
  }
  return blobIn(img, S.cx, S.cy, S.r * 1.35);
}

function feetPerNorm(){
  const d = (S.mark && S.mark.d) || (S.ball && S.ball.d) || (S.r * 1.1);
  return BALL_FT / Math.max(d, 0.014);
}

function publish(mph){
  mph = Math.round(mph);
  $("mph").innerHTML = mph + "<span>MPH</span>";
  const el = $("arrow");
  if (S.lastMph == null){ el.textContent = "→"; el.className = "arrow same"; }
  else if (mph > S.lastMph + 1){ el.textContent = "↑"; el.className = "arrow up"; }
  else if (mph < S.lastMph - 1){ el.textContent = "↓"; el.className = "arrow down"; }
  else { el.textContent = "→"; el.className = "arrow same"; }
  $("meta").textContent = "Peak frames · size 4 ball is the ruler";
  S.lastMph = mph;
  say(mph + " MPH · put the ball back in the ring");
  S.phase = "done";
  S.path = [];
}

function speedFromPath(){
  const tr = S.path;
  if (tr.length < 2) return false;
  const toward = S.gx - S.cx;
  const aspect = innerHeight / innerWidth;
  const fpp = feetPerNorm();
  let best = 0;
  for (let i = 0; i < tr.length - 1; i++){
    const a = tr[i], b = tr[i + 1];
    const dt = b.t - a.t;
    if (dt < 0.018 || dt > 0.12) continue;
    const dx = b.x - a.x, dy = b.y - a.y;
    if (toward !== 0 && dx * toward <= 0) continue;
    const mph = (Math.hypot(dx, dy * aspect) * fpp / dt) * 0.681818;
    if (mph > best) best = mph;
  }
  if (tr.length >= 3){
    const a = tr[0], b = tr[Math.min(tr.length - 1, 4)];
    const dt = b.t - a.t;
    if (dt >= 0.04 && dt <= 0.22){
      const dx = b.x - a.x, dy = b.y - a.y;
      if (!(toward !== 0 && dx * toward <= 0)){
        const mph = (Math.hypot(dx, dy * aspect) * fpp / dt) * 0.681818;
        if (mph > best) best = mph;
      }
    }
  }
  if (best >= 10 && best <= 80){
    publish(best);
    return true;
  }
  return false;
}

function beginFly(t, x, y){
  S.phase = "fly";
  S.flyStart = t;
  S.path = [];
  if (S.mark) S.path.push({ t: S.mark.t || t, x: S.mark.x, y: S.mark.y });
  S.path.push({ t, x, y });
  say("KICK — left the mark");
}

function draw(hit){
  const w = cv.width, h = cv.height;
  ctx.clearRect(0, 0, w, h);
  const armed = S.phase === "mark" || S.phase === "fly";
  ctx.strokeStyle = armed ? "#ff2a2a" : PINK;
  ctx.fillStyle = ctx.strokeStyle;
  ctx.lineWidth = 4 * devicePixelRatio;
  ctx.setLineDash([14 * devicePixelRatio, 10 * devicePixelRatio]);
  ctx.beginPath();
  ctx.arc(S.cx * w, S.cy * h, S.r * w, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = (12 * devicePixelRatio) + "px sans-serif";
  ctx.fillText("SIZE 4", S.cx * w - 24, S.cy * h - S.r * w - 8);
  ctx.lineWidth = 5 * devicePixelRatio;
  ctx.beginPath();
  ctx.moveTo(S.gx * w, 0);
  ctx.lineTo(S.gx * w, h);
  ctx.stroke();
  ctx.fillText("GATE", S.gx * w + 8, 28 * devicePixelRatio);
  const L = hit || S.ball;
  if (L){
    ctx.strokeStyle = armed ? "#ff2a2a" : "#7dff6a";
    ctx.lineWidth = 4 * devicePixelRatio;
    const rr = Math.min(S.r * w * 0.8, Math.max(8 * devicePixelRatio, (L.d || 0.03) * w * 0.5));
    ctx.beginPath();
    ctx.arc(L.x * w, L.y * h, rr, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function loop(){
  if (!S.live) return;
  if (vid.videoWidth){
    const tw = 640, th = Math.round(640 * cv.height / cv.width);
    if (analyze.width !== tw || analyze.height !== th){
      analyze.width = tw; analyze.height = th;
    }
    drawCover(actx, vid, tw, th, true);
    const frame = actx.getImageData(0, 0, tw, th);
    const hit = findBall(frame);
    const t = performance.now() / 1000;
    const quiet = S.drag || performance.now() < S.quietUntil;

    if (quiet){
      draw(hit);
      requestAnimationFrame(loop);
      return;
    }

    if (S.phase === "done"){
      if (hit && inRing(hit)){
        S.phase = "seek";
        S.still = 0;
        S.ball = hit;
        say("Ball in ring — hold still");
      }
      draw(hit);
      requestAnimationFrame(loop);
      return;
    }

    if (S.phase === "fly"){
      if (hit){
        if (S.ball){
          S.vx = hit.x - S.ball.x;
          S.vy = hit.y - S.ball.y;
        }
        S.ball = hit;
        S.path.push({ t, x: hit.x, y: hit.y });
        if (speedFromPath()) { draw(hit); requestAnimationFrame(loop); return; }
      }
      if (t - S.flyStart > 0.80){
        if (!speedFromPath()){
          say("Missed the flight — ball back in the ring");
          S.phase = "done";
        }
      }
      draw(hit || S.ball);
      requestAnimationFrame(loop);
      return;
    }

    // seek or mark — once armed, stay armed until the ball leaves the ring
    if (S.phase === "mark"){
      if (hit && inRing(hit)){
        S.ball = hit;
        S.miss = 0;
        say("ON THE MARK — kick when ready");
      } else {
        S.miss++;
        if (S.miss >= 2){
          const x = hit ? hit.x : (S.mark ? S.mark.x : S.cx);
          const y = hit ? hit.y : (S.mark ? S.mark.y : S.cy);
          beginFly(t, x, y);
        }
      }
    } else if (hit && inRing(hit)){
      S.ball = hit;
      S.still++;
      if (S.still >= 6){
        S.mark = { x: hit.x, y: hit.y, d: hit.d, t };
        S.phase = "mark";
        $("lock").className = "go";
        say("ON THE MARK — kick when ready");
      } else {
        say("Ball in ring — hold still…");
      }
    } else {
      S.still = 0;
      S.ball = null;
      say("Looking for the ball in the ring…");
    }
    draw(hit || S.ball);
  } else {
    draw(null);
  }
  requestAnimationFrame(loop);
}

$("cam").onclick = () => startCam().catch(() => alert("Allow camera"));
$("lock").onclick = () => {
  const arm = () => {
    if (S.ball) S.mark = { x: S.ball.x, y: S.ball.y, d: S.ball.d, t: performance.now() / 1000 };
    else S.mark = { x: S.cx, y: S.cy, d: S.r * 1.1, t: performance.now() / 1000 };
    S.phase = "mark";
    S.still = 99;
    $("lock").className = "go";
    say("ON THE MARK — kick when ready");
  };
  if (!S.live) startCam().then(arm); else arm();
};
$("unlock").onclick = () => {
  resetSeek();
  say("RECALIBRATE — drag the ring onto the ball");
};
</script>
</body>
</html>
