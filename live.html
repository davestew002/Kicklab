<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<title>KICKLAB LIVE</title>
<style>
  :root{--lime:#c8ff3d;--pink:#ff2ec8;--txt:#f4f6fb}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#05070c;color:var(--txt);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}
  #stage{position:fixed;inset:0;z-index:1;touch-action:none}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  video{z-index:1;transform:scaleX(-1)}
  canvas{z-index:2}
  #hud{position:fixed;inset:0;z-index:3;pointer-events:none}
  #hud *{pointer-events:auto}
  .top{position:absolute;top:calc(6px + env(safe-area-inset-top));left:10px;right:10px}
  .brand{letter-spacing:.28em;font-size:10px;color:var(--lime);font-weight:700}
  .panel{background:rgba(8,10,16,.82);border:1px solid #2a3348;border-radius:14px;padding:8px 10px;margin-top:6px;backdrop-filter:blur(10px);max-width:64vw}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
  select,button{border:0;border-radius:10px;padding:8px 10px;font:inherit;font-weight:800}
  select{background:#0c0f16;color:var(--txt);border:1px solid #2a3348;font-weight:600}
  .go{background:var(--lime);color:#111}
  .ghost{background:#0c0f16;color:var(--txt);border:1px solid #2a3348}
  .prompt{margin-top:6px;font-size:15px;font-weight:800;letter-spacing:.03em;color:var(--lime)}
  .mphwrap{position:absolute;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));text-align:right;pointer-events:none}
  .mph{font-size:84px;font-weight:800;letter-spacing:-.06em;line-height:.85;text-shadow:0 8px 30px #000}
  .mph span{font-size:16px;color:var(--lime);margin-left:6px}
  .arrow{font-size:90px;line-height:.65}
  .up{color:#7dff6a}.down{color:#ff4d4d}.same{color:#e6c35a}
  .sub{color:#d7dce8;font-size:13px}
</style>
</head>
<body>
<div id="stage">
  <video id="vid" playsinline muted autoplay></video>
  <canvas id="cv"></canvas>
</div>
<div id="hud">
  <div class="top">
    <div class="brand">KICKLAB LIVE</div>
    <div class="panel">
      <div class="row">
        <select id="size"><option selected>Size 4</option></select>
        <button class="ghost" id="cam">START CAMERA</button>
        <button class="ghost" id="lock">LOCK</button>
        <button class="ghost" id="unlock">RECALIBRATE</button>
      </div>
      <div class="prompt" id="prompt">START CAMERA · put the ball in the pink ring</div>
    </div>
  </div>
  <div class="mphwrap">
    <div class="arrow same" id="arrow">→</div>
    <div class="mph" id="mph">—<span>MPH</span></div>
    <div class="sub" id="meta">Size 4 ball is the ruler</div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const vid = $("vid");
const cv = $("cv");
const ctx = cv.getContext("2d", { willReadFrequently: true });
const buf = document.createElement("canvas");
const btx = buf.getContext("2d", { willReadFrequently: true });
const AW = 480;
const BALL_FT = 0.673;
const PINK = "#ff2ec8";

const S = {
  live:false, phase:"off",
  cx:0.74, cy:0.68, r:0.042, gx:0.22,
  drag:false, quiet:0,
  still:0, empty:0,
  mark:null, lastMph:null,
  burst:[], burstEnd:0,
  mean0:0
};

function say(t){ $("prompt").textContent = t; }
function clearMph(){
  $("mph").innerHTML = "—<span>MPH</span>";
  $("arrow").textContent = "→";
  $("arrow").className = "arrow same";
  $("meta").textContent = "Size 4 ball is the ruler";
}
function fit(){
  cv.width = innerWidth * devicePixelRatio;
  cv.height = innerHeight * devicePixelRatio;
}
addEventListener("resize", fit); fit();

function drawCover(c, w, h){
  const vw = vid.videoWidth, vh = vid.videoHeight;
  if (!vw) return;
  const s = Math.max(w/vw, h/vh);
  const dw = vw*s, dh = vh*s;
  c.save();
  c.translate(w, 0); c.scale(-1, 1);
  c.drawImage(vid, (w-dw)/2, (h-dh)/2, dw, dh);
  c.restore();
}

function snap(){
  const th = Math.max(200, Math.round(AW * cv.height / cv.width));
  if (buf.width !== AW || buf.height !== th){ buf.width = AW; buf.height = th; }
  drawCover(btx, AW, th);
  return btx.getImageData(0, 0, AW, th);
}

function frameMean(img){
  const d = img.data; let s = 0, n = 0;
  for (let i = 0; i < d.length; i += 32){ s += d[i]+d[i+1]+d[i+2]; n++; }
  return s / (n*3);
}

function isGrass(r,g,b){ return g > r+12 && g > b+8 && g > 45; }
function isSkin(r,g,b){
  return r > 80 && g > 45 && r > b+8 && r-g < 55 && g-b < 45 && (r+g+b)/3 < 175;
}
function isBall(r,g,b){
  if (isGrass(r,g,b) || isSkin(r,g,b)) return false;
  const lum = (r+g+b)/3;
  if (lum >= 168) return true;
  if (r > 145 && r > g+28 && r > b+18) return true;
  return false;
}

function blobIn(img, x0,x1,y0,y1, need){
  const {data,width:w,height:h} = img;
  const xa=Math.max(1,(x0*w)|0), xb=Math.min(w-1,(x1*w)|0);
  const ya=Math.max(1,(y0*h)|0), yb=Math.min(h-1,(y1*h)|0);
  let best=null, bestN=need-1;
  const step=3;
  for (let y=ya; y<yb; y+=step){
    for (let x=xa; x<xb; x+=step){
      const i=(y*w+x)*4;
      if (!isBall(data[i],data[i+1],data[i+2])) continue;
      let n=0,sx=0,sy=0,minx=w,maxx=0,miny=h,maxy=0;
      const R=12;
      for (let yy=y-R; yy<=y+R; yy+=2){
        if (yy<1||yy>=h-1) continue;
        for (let xx=x-R; xx<=x+R; xx+=2){
          if (xx<1||xx>=w-1) continue;
          const j=(yy*w+xx)*4;
          if (!isBall(data[j],data[j+1],data[j+2])) continue;
          n++; sx+=xx; sy+=yy;
          if (xx<minx)minx=xx; if(xx>maxx)maxx=xx;
          if (yy<miny)miny=yy; if(yy>maxy)maxy=yy;
        }
      }
      if (n <= bestN) continue;
      const dw=(maxx-minx)/w, dh=(maxy-miny)/h;
      const d=Math.max(dw,dh);
      if (d<0.018 || d>0.09) continue;
      const asp = dw>dh ? dw/Math.max(dh,0.001) : dh/Math.max(dw,0.001);
      if (asp > 1.45) continue;
      bestN=n;
      best={ n, x:sx/n/w, y:sy/n/h, d };
    }
  }
  return best;
}

function ringBall(img){
  const pad = S.r * 1.15;
  return blobIn(img, S.cx-pad, S.cx+pad, S.cy-pad*1.3, S.cy+pad*1.3, 16);
}

function leftBall(img){
  return blobIn(img, 0.01, S.cx-0.05, 0.32, 0.92, 12);
}

function covered(img){
  const m = frameMean(img);
  if (!S.mean0) return false;
  if (Math.abs(m - S.mean0) > 55) return true;
  let skin=0, tot=0;
  const d=img.data;
  for (let i=0;i<d.length;i+=40){
    tot++;
    if (isSkin(d[i],d[i+1],d[i+2])) skin++;
  }
  return skin/tot > 0.28;
}

function publish(mph, extra){
  const n = Math.round(mph);
  $("mph").innerHTML = n + "<span>MPH</span>";
  const el=$("arrow");
  if (S.lastMph==null){ el.textContent="→"; el.className="arrow same"; }
  else if (n>S.lastMph+1){ el.textContent="↑"; el.className="arrow up"; }
  else if (n<S.lastMph-1){ el.textContent="↓"; el.className="arrow down"; }
  else { el.textContent="→"; el.className="arrow same"; }
  S.lastMph=n;
  $("meta").textContent = extra;
  say(n + " MPH · put the ball back");
  S.phase="done";
}

function finishBurst(){
  const clips=S.burst; S.burst=[];
  if (covered(clips[clips.length-1]?.img || clips[0].img)){
    say("Camera blocked — leave the phone on the stand");
    S.phase="done"; return;
  }
  if (!S.mark || clips.length<4){
    say("Missed the flight — ball back in the ring");
    S.phase="done"; return;
  }
  const hits=[];
  for (const c of clips){
    const b=leftBall(c.img);
    if (b && b.x < S.mark.x-0.07) hits.push({t:c.t, x:b.x, y:b.y, d:b.d});
  }
  if (hits.length<2){
    say("Saw the kick, lost the ball — one more");
    S.phase="done"; return;
  }
  const a=hits[0], b=hits[hits.length-1];
  const dt=b.t-a.t;
  if (dt<0.07){ say("Too few frames — kick again"); S.phase="done"; return; }
  const aspect=innerHeight/innerWidth;
  const fpp=BALL_FT/Math.max(S.mark.d||0.04, 0.02);
  const dist=Math.hypot(b.x-S.mark.x, (b.y-S.mark.y)*aspect)*fpp;
  const mph=(dist/dt)*0.681818;
  if (dist<1.8 || mph<8 || mph>62){
    say("Could not trust that read — kick again");
    S.phase="done"; return;
  }
  publish(mph, hits.length+" frames · "+dt.toFixed(2)+"s · size 4");
}

function draw(hit){
  const w=cv.width,h=cv.height;
  ctx.clearRect(0,0,w,h);
  const armed = S.phase==="mark"||S.phase==="burst";
  ctx.strokeStyle = armed ? "#ff2a2a" : PINK;
  ctx.fillStyle = ctx.strokeStyle;
  ctx.lineWidth = 4*devicePixelRatio;
  ctx.setLineDash([14*devicePixelRatio,10*devicePixelRatio]);
  ctx.beginPath(); ctx.arc(S.cx*w,S.cy*h,S.r*w,0,Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.font=(12*devicePixelRatio)+"px sans-serif";
  ctx.fillText("SIZE 4", S.cx*w-24, S.cy*h-S.r*w-8);
  ctx.lineWidth=5*devicePixelRatio;
  ctx.beginPath(); ctx.moveTo(S.gx*w,0); ctx.lineTo(S.gx*w,h); ctx.stroke();
  ctx.fillText("GATE", S.gx*w+8, 28*devicePixelRatio);
  if (hit){
    ctx.strokeStyle = armed ? "#ff2a2a" : "#7dff6a";
    ctx.beginPath();
    ctx.arc(hit.x*w, hit.y*h, Math.max(8, (hit.d||0.03)*w*0.5), 0, Math.PI*2);
    ctx.stroke();
  }
}

function loop(){
  if (!S.live) return;
  if (!vid.videoWidth){ requestAnimationFrame(loop); return; }
  const img=snap();
  const t=performance.now()/1000;
  const quiet=S.drag || performance.now()<S.quiet;
  const ball=ringBall(img);
  const blocked=covered(img);

  if (S.phase==="burst"){
    if (!blocked) S.burst.push({t,img});
    draw(ball);
    if (t>=S.burstEnd) finishBurst();
    requestAnimationFrame(loop); return;
  }

  if (quiet || blocked){
    if (blocked && S.phase==="mark") say("Hand over camera — step back");
    draw(ball); requestAnimationFrame(loop); return;
  }

  if (S.phase==="done"){
    if (ball && ball.n>20){
      S.phase="seek"; S.still=0; S.empty=0;
      say("Ball in ring — hold still");
    }
    draw(ball); requestAnimationFrame(loop); return;
  }

  if (S.phase==="mark"){
    if (ball){
      S.empty=0;
      S.mark={x:ball.x,y:ball.y,d:ball.d,t};
      say("ON THE MARK — kick when ready");
      draw(ball);
    } else {
      S.empty++;
      if (S.empty>=2){
        S.phase="burst";
        S.burst=[{t,img}];
        S.burstEnd=t+0.60;
        say("KICK — capturing");
      }
      draw(null);
    }
    requestAnimationFrame(loop); return;
  }

  if (S.phase==="seek"){
    if (ball){
      S.still++;
      if (S.still>=6){
        S.mark={x:ball.x,y:ball.y,d:ball.d,t};
        S.mean0=frameMean(img);
        S.phase="mark"; S.empty=0;
        $("lock").className="go";
        clearMph();
        say("ON THE MARK — kick when ready");
      } else say("Ball in ring — hold still");
    } else {
      S.still=0;
      say("Looking for a ball in the ring…");
    }
    draw(ball);
  }
  requestAnimationFrame(loop);
}

function startCam(){
  navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{ facingMode:"user", width:{ideal:1280}, height:{ideal:720} }
  }).then(s=>{ vid.srcObject=s; return vid.play(); })
    .then(()=>{
      S.live=true; S.phase="seek";
      $("cam").textContent="CAMERA ON"; $("cam").className="go";
      say("Looking for a ball in the ring…");
      loop();
    }).catch(()=>say("Allow Safari camera access"));
}

function reset(){
  S.phase=S.live?"seek":"off";
  S.still=0; S.empty=0; S.mark=null; S.burst=[];
  $("lock").className="ghost";
  clearMph();
  say(S.live?"Looking for a ball in the ring…":"START CAMERA");
}

$("cam").onclick=startCam;
$("unlock").onclick=reset;
$("lock").onclick=()=>{
  if (!S.live){ startCam(); return; }
  const img=snap();
  const ball=ringBall(img);
  if (!ball){ say("No ball in the ring — drag the ring onto it"); return; }
  S.mark={x:ball.x,y:ball.y,d:ball.d,t:performance.now()/1000};
  S.mean0=frameMean(img);
  S.phase="mark"; S.empty=0;
  $("lock").className="go";
  clearMph();
  say("ON THE MARK — kick when ready");
};

function pt(e){
  const t=e.touches?e.touches[0]:e;
  return {x:t.clientX/innerWidth, y:t.clientY/innerHeight};
}
cv.addEventListener("pointerdown", e=>{
  const p=pt(e);
  if (Math.hypot(p.x-S.cx,p.y-S.cy)<S.r+0.08){ S.drag="ring"; S.quiet=performance.now()+800; }
  else if (Math.abs(p.x-S.gx)<0.06) S.drag="gate";
});
addEventListener("pointermove", e=>{
  if (!S.drag) return;
  const p=pt(e);
  if (S.drag==="ring") S.cy=Math.min(0.90,Math.max(0.38,p.y));
  if (S.drag==="gate") S.gx=Math.min(0.40,Math.max(0.08,p.x));
});
addEventListener("pointerup", ()=>{
  if (S.drag) S.quiet=performance.now()+800;
  S.drag=false;
});
</script>
</body>
</html>
