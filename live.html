<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<title>KICKLAB LIVE</title>
<style>
  :root{--lime:#c8ff3d;--pink:#ff2ec8;--txt:#f4f6fb}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#05070c;color:var(--txt);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}
  #stage{position:fixed;inset:0;z-index:1;touch-action:none}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  video{z-index:1;transform:scaleX(-1)}
  canvas{z-index:2}
  #hud{position:fixed;inset:0;z-index:3;pointer-events:none}
  #hud *{pointer-events:auto}
  .top{position:absolute;top:calc(6px + env(safe-area-inset-top));left:10px;right:10px}
  .brand{letter-spacing:.28em;font-size:10px;color:var(--lime);font-weight:700}
  .panel{background:rgba(8,10,16,.8);border:1px solid #2a3348;border-radius:14px;padding:8px 10px;margin-top:6px;backdrop-filter:blur(10px);max-width:62vw}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
  select,button{border:0;border-radius:10px;padding:8px 10px;font:inherit;font-weight:800}
  select{background:#0c0f16;color:var(--txt);border:1px solid #2a3348;font-weight:600}
  .go{background:var(--lime);color:#111}
  .ghost{background:#0c0f16;color:var(--txt);border:1px solid #2a3348}
  .prompt{margin-top:6px;font-size:15px;font-weight:800;letter-spacing:.04em;color:var(--lime)}
  .mphwrap{position:absolute;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));text-align:right;pointer-events:none}
  .mph{font-size:84px;font-weight:800;letter-spacing:-.06em;line-height:.85;text-shadow:0 8px 30px #000}
  .mph span{font-size:16px;color:var(--lime);margin-left:6px}
  .arrow{font-size:90px;line-height:.65}
  .up{color:#7dff6a}.down{color:#ff4d4d}.same{color:#e6c35a}
  .sub{color:#d7dce8;font-size:13px}
</style>
</head>
<body>
<div id="stage">
  <video id="vid" playsinline muted autoplay></video>
  <canvas id="cv"></canvas>
</div>
<div id="hud">
  <div class="top">
    <div class="brand">KICKLAB LIVE</div>
    <div class="panel">
      <div class="row">
        <select id="size"><option value="0.205" selected>Size 4</option></select>
        <button class="ghost" id="cam">START CAMERA</button>
        <button class="ghost" id="lock">LOCK</button>
        <button class="ghost" id="unlock">RECALIBRATE</button>
      </div>
      <div class="prompt" id="prompt">START CAMERA · ball in the pink ring</div>
    </div>
  </div>
  <div class="mphwrap">
    <div class="arrow same" id="arrow">→</div>
    <div class="mph" id="mph">—<span>MPH</span></div>
    <div class="sub" id="meta">Capture on kick · size 4 ruler</div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const vid = $("vid");
const cv = $("cv");
const ctx = cv.getContext("2d", { willReadFrequently: true });
const analyze = document.createElement("canvas");
const actx = analyze.getContext("2d", { willReadFrequently: true });

const BALL_FT = 0.673;
const RING_R = 0.042;
const PINK = "#ff2ec8";
const AW = 480;

const S = {
  live: false,
  phase: "off",
  cx: 0.74, cy: 0.68, r: RING_R,
  gx: 0.22,
  drag: false,
  quietUntil: 0,
  lastY: 0,
  still: 0,
  mark: null,
  fillLock: 0,
  lastMph: null,
  burst: [],
  burstUntil: 0
};

function say(t){ $("prompt").textContent = t; }
function clearMph(){
  $("mph").innerHTML = "—<span>MPH</span>";
  $("arrow").textContent = "→";
  $("arrow").className = "arrow same";
}

function fit(){
  cv.width = innerWidth * devicePixelRatio;
  cv.height = innerHeight * devicePixelRatio;
}
addEventListener("resize", fit);
fit();

function drawCover(c, video, w, h){
  const vw = video.videoWidth || w, vh = video.videoHeight || h;
  const s = Math.max(w / vw, h / vh);
  const dw = vw * s, dh = vh * s;
  c.save();
  c.translate(w, 0);
  c.scale(-1, 1);
  c.drawImage(video, (w - dw) / 2, (h - dh) / 2, dw, dh);
  c.restore();
}

function isBall(r,g,b){
  if (g > r + 14 && g > b + 10 && g > 48) return false;
  const lum = (r + g + b) / 3;
  if (lum > 145) return true;
  if (r > 135 && r > g + 22 && r > b + 12) return true;
  if (lum < 72 && Math.abs(r-g) < 28 && Math.abs(g-b) < 28) return true;
  return lum > 95;
}

function snap(){
  const th = Math.round(AW * cv.height / cv.width);
  if (analyze.width !== AW || analyze.height !== th){
    analyze.width = AW; analyze.height = th;
  }
  drawCover(actx, vid, AW, th);
  return actx.getImageData(0, 0, AW, th);
}

function ringFill(img){
  const { data, width:w, height:h } = img;
  const cx = S.cx * w, cy = S.cy * h, rr = S.r * w;
  let n = 0, sx = 0, sy = 0;
  const step = 2;
  for (let y = Math.max(0, (cy-rr)|0); y < Math.min(h, cy+rr); y += step){
    for (let x = Math.max(0, (cx-rr)|0); x < Math.min(w, cx+rr); x += step){
      const dx = x-cx, dy = y-cy;
      if (dx*dx + dy*dy > rr*rr) continue;
      const i = (y*w + x)*4;
      if (!isBall(data[i], data[i+1], data[i+2])) continue;
      n++; sx += x; sy += y;
    }
  }
  if (n < 12) return { n:0 };
  return { n, x: sx/n/w, y: sy/n/h };
}

function findBall(img, x0, x1, y0, y1){
  const { data, width:w, height:h } = img;
  const xa = Math.max(1, (x0*w)|0);
  const xb = Math.min(w-1, (x1*w)|0);
  const ya = Math.max(1, (y0*h)|0);
  const yb = Math.min(h-1, (y1*h)|0);
  let best = null, bestN = 8;
  const step = 3;
  for (let y = ya; y < yb; y += step){
    for (let x = xa; x < xb; x += step){
      const i = (y*w + x)*4;
      if (!isBall(data[i], data[i+1], data[i+2])) continue;
      let n = 0, sx = 0, sy = 0;
      const d = 11;
      for (let yy = y-d; yy <= y+d; yy += 2){
        if (yy<1||yy>=h-1) continue;
        for (let xx = x-d; xx <= x+d; xx += 2){
          if (xx<1||xx>=w-1) continue;
          const j = (yy*w + xx)*4;
          if (!isBall(data[j], data[j+1], data[j+2])) continue;
          n++; sx += xx; sy += yy;
        }
      }
      if (n > bestN && n > 14 && n < 220){
        bestN = n;
        best = { x: sx/n/w, y: sy/n/h, n };
      }
    }
  }
  return best;
}

function measureBurst(){
  const clips = S.burst;
  S.burst = [];
  if (clips.length < 4 || !S.mark){
    say("Missed the flight — ball back in the ring");
    S.phase = "done";
    return;
  }
  const hits = [];
  for (const c of clips){
    const b = findBall(c.img, 0.02, S.cx - 0.04, 0.30, 0.92);
    if (b && b.x < S.mark.x - 0.06) hits.push({ t:c.t, x:b.x, y:b.y });
  }
  if (hits.length < 2){
    say("Saw the kick, lost the ball — try again");
    S.phase = "done";
    return;
  }
  const a = hits[0];
  const b = hits[hits.length - 1];
  const dt = b.t - a.t;
  if (dt < 0.06){
    say("Too few frames — kick again");
    S.phase = "done";
    return;
  }
  const aspect = innerHeight / innerWidth;
  const fpp = BALL_FT / Math.max(S.mark.d || 0.04, 0.02);
  const dist = Math.hypot(b.x - S.mark.x, (b.y - S.mark.y) * aspect) * fpp;
  const mph = (dist / dt) * 0.681818;
  if (mph < 8 || mph > 65 || dist < 1.6){
    say("Could not trust that read — kick again");
    S.phase = "done";
    return;
  }
  const n = Math.round(mph);
  $("mph").innerHTML = n + "<span>MPH</span>";
  const el = $("arrow");
  if (S.lastMph == null){ el.textContent = "→"; el.className = "arrow same"; }
  else if (n > S.lastMph + 1){ el.textContent = "↑"; el.className = "arrow up"; }
  else if (n < S.lastMph - 1){ el.textContent = "↓"; el.className = "arrow down"; }
  else { el.textContent = "→"; el.className = "arrow same"; }
  S.lastMph = n;
  $("meta").textContent = hits.length + " frames · " + dt.toFixed(2) + "s · size 4";
  say(n + " MPH · put the ball back");
  S.phase = "done";
}

function draw(hit){
  const w = cv.width, h = cv.height;
  ctx.clearRect(0,0,w,h);
  const armed = S.phase === "mark" || S.phase === "burst";
  ctx.strokeStyle = armed ? "#ff2a2a" : PINK;
  ctx.fillStyle = ctx.strokeStyle;
  ctx.lineWidth = 4 * devicePixelRatio;
  ctx.setLineDash([14*devicePixelRatio, 10*devicePixelRatio]);
  ctx.beginPath();
  ctx.arc(S.cx*w, S.cy*h, S.r*w, 0, Math.PI*2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = (12*devicePixelRatio)+"px sans-serif";
  ctx.fillText("SIZE 4", S.cx*w-24, S.cy*h - S.r*w - 8);
  ctx.lineWidth = 5*devicePixelRatio;
  ctx.beginPath();
  ctx.moveTo(S.gx*w, 0);
  ctx.lineTo(S.gx*w, h);
  ctx.stroke();
  ctx.fillText("GATE", S.gx*w+8, 28*devicePixelRatio);
  if (hit && hit.x != null){
    ctx.strokeStyle = armed ? "#ff2a2a" : "#7dff6a";
    ctx.beginPath();
    ctx.arc(hit.x*w, hit.y*h, S.r*w*0.8, 0, Math.PI*2);
    ctx.stroke();
  }
}

function loop(){
  if (!S.live) return;
  if (!vid.videoWidth){ requestAnimationFrame(loop); return; }
  const img = snap();
  const t = performance.now()/1000;
  const quiet = S.drag || performance.now() < S.quietUntil;
  const fill = ringFill(img);

  if (S.phase === "burst"){
    S.burst.push({ t, img });
    draw(fill.n ? fill : null);
    if (t >= S.burstUntil) measureBurst();
    requestAnimationFrame(loop);
    return;
  }

  if (quiet){
    draw(fill.n ? fill : null);
    requestAnimationFrame(loop);
    return;
  }

  if (S.phase === "done"){
    if (fill.n > 40 && fill.n > S.fillLock * 0.45){
      S.phase = "seek";
      S.still = 0;
      say("Ball in ring — hold still");
    }
    draw(fill.n ? fill : null);
    requestAnimationFrame(loop);
    return;
  }

  if (S.phase === "mark"){
    if (fill.n > S.fillLock * 0.40 && fill.n > 22){
      draw(fill);
      say("ON THE MARK — kick when ready");
    } else {
      S.phase = "burst";
      S.burst = [{ t, img }];
      S.burstUntil = t + 0.55;
      say("KICK — capturing");
    }
    requestAnimationFrame(loop);
    return;
  }

  if (S.phase === "seek"){
    if (fill.n > 35){
      const moved = S.lastY && Math.abs(fill.y - S.lastY) > 0.03;
      S.still = moved ? 0 : S.still + 1;
      S.lastY = fill.y;
      if (S.still >= 5){
        S.mark = { x: fill.x, y: fill.y, d: 0.04, t };
        S.fillLock = fill.n;
        S.phase = "mark";
        $("lock").className = "go";
        clearMph();
        say("ON THE MARK — kick when ready");
      } else {
        say("Ball in ring — hold still");
      }
    } else {
      S.still = 0;
      say("Looking for the ball in the ring…");
    }
    draw(fill.n ? fill : null);
  }

  requestAnimationFrame(loop);
}

function startCam(){
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  }).then(stream => {
    vid.srcObject = stream;
    return vid.play();
  }).then(() => {
    S.live = true;
    S.phase = "seek";
    $("cam").textContent = "CAMERA ON";
    $("cam").className = "go";
    say("Looking for the ball in the ring…");
    loop();
  }).catch(() => say("Camera blocked — allow Safari camera"));
}

function resetSeek(){
  S.phase = S.live ? "seek" : "off";
  S.still = 0;
  S.mark = null;
  S.burst = [];
  S.fillLock = 0;
  $("lock").className = "ghost";
  clearMph();
  say(S.live ? "Looking for the ball in the ring…" : "START CAMERA");
}

function arm(){
  if (!S.live) return;
  S.mark = { x: S.cx, y: S.cy, d: 0.04, t: performance.now()/1000 };
  S.fillLock = 80;
  S.phase = "mark";
  $("lock").className = "go";
  clearMph();
  say("ON THE MARK — kick when ready");
}

$("cam").onclick = startCam;
$("lock").onclick = arm;
$("unlock").onclick = resetSeek;

function pt(e){
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX / innerWidth, y: t.clientY / innerHeight };
}
cv.addEventListener("pointerdown", e => {
  const p = pt(e);
  if (Math.hypot(p.x - S.cx, p.y - S.cy) < S.r + 0.08){
    S.drag = "ring";
    S.quietUntil = performance.now() + 700;
  } else if (Math.abs(p.x - S.gx) < 0.06){
    S.drag = "gate";
  }
});
addEventListener("pointermove", e => {
  if (!S.drag) return;
  const p = pt(e);
  if (S.drag === "ring") S.cy = Math.min(0.90, Math.max(0.35, p.y));
  if (S.drag === "gate") S.gx = Math.min(0.40, Math.max(0.08, p.x));
});
addEventListener("pointerup", () => {
  if (S.drag) S.quietUntil = performance.now() + 700;
  S.drag = false;
});
</script>
</body>
</html>
