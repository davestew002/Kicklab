<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<title>KICKLAB LIVE</title>
<style>
  :root{--lime:#c8ff3d;--pink:#ff2ec8;--dim:#8b93a7;--txt:#f4f6fb}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#05070c;color:var(--txt);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}
  #stage{position:fixed;inset:0}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  canvas{z-index:2} video{z-index:1;transform:scaleX(-1)}
  #hud{position:fixed;inset:0;z-index:3;pointer-events:none}
  #stage{z-index:1;touch-action:none}
  #hud *{pointer-events:auto}
  .top{position:absolute;top:calc(6px + env(safe-area-inset-top));left:10px;right:10px}
  .brand{letter-spacing:.28em;font-size:10px;color:var(--lime);font-weight:700}
  .panel{background:rgba(8,10,16,.8);border:1px solid #2a3348;border-radius:14px;padding:8px 10px;margin-top:6px;backdrop-filter:blur(10px);max-width:52vw}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
  select,button{border:0;border-radius:10px;padding:8px 10px;font:inherit;font-weight:800}
  select{background:#0c0f16;color:var(--txt);border:1px solid #2a3348;font-weight:600}
  .go{background:var(--lime);color:#111}
  .ghost{background:#0c0f16;color:var(--txt);border:1px solid #2a3348}
  .prompt{margin-top:6px;font-size:15px;font-weight:800;letter-spacing:.04em;color:var(--lime)}
  .mphwrap{position:absolute;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));text-align:right;pointer-events:none}
  .mph{font-size:84px;font-weight:800;letter-spacing:-.06em;line-height:.85;text-shadow:0 8px 30px #000}
  .mph span{font-size:16px;color:var(--lime);margin-left:6px}
  .arrow{font-size:90px;line-height:.65}.up{color:#7dff6a}.down{color:#ff4d4d}.same{color:#e6c35a}
  .sub{color:#d7dce8;font-size:13px}
</style>
</head>
<body>
<div id="stage"><video id="vid" playsinline muted autoplay></video><canvas id="cv"></canvas></div>
<div id="hud">
  <div class="top">
    <div class="brand">KICKLAB LIVE</div>
    <div class="panel" id="cal">
      <div class="row">
        <select id="size"><option value="0.205" selected>Size 4</option></select>
        <button class="ghost" id="cam">START CAMERA</button>
        <button class="ghost" id="lock">LOCK</button>
        <button class="ghost" id="unlock">RECALIBRATE</button>
      </div>
      <div class="prompt" id="prompt">START CAMERA · put the ball in the pink ring</div>
    </div>
  </div>
  <div class="mphwrap" id="readout">
    <div class="arrow same" id="arrow">→</div>
    <div class="mph" id="mph">—<span>MPH</span></div>
    <div class="sub" id="meta">Speed from frames · 2-FT ring is the ruler</div>
  </div>
</div>
<script>
const vid=$("vid"), cv=$("cv"), ctx=cv.getContext("2d",{willReadFrequently:true});
function $(id){return document.getElementById(id)}

function drawCover(c, video, W, H, mirror){
  const vw=video.videoWidth, vh=video.videoHeight;
  if(!vw) return;
  const scale=Math.max(W/vw, H/vh);
  const dw=vw*scale, dh=vh*scale;
  const ox=(W-dw)/2, oy=(H-dh)/2;
  c.save();
  if(mirror){ c.translate(W,0); c.scale(-1,1); c.drawImage(video, W-ox-dw, oy, dw, dh); }
  else c.drawImage(video, ox, oy, dw, dh);
  c.restore();
}

const PINK="#ff2ec8";
const state={live:false,locked:false,cx:0.74,cy:0.68,r:0.042,gx:0.22,drag:null,lastMph:null,track:[],ready:false,prevData:null,lock:null,flying:false,vx:0,vy:0};
function resize(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
addEventListener("resize",resize); resize();
function prompt(t){$("prompt").textContent=t}

async function startCam(){
  const s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:"user",width:{ideal:1280},height:{ideal:720},frameRate:{ideal:60}}});
  vid.srcObject=s; await vid.play(); state.live=true; prompt("Place the ball inside the pink ring"); loop();
}

function toNorm(ev){const r=cv.getBoundingClientRect();return {x:(ev.clientX-r.left)/r.width,y:(ev.clientY-r.top)/r.height}}
function onDown(ev){
  if(ev.target.closest && ev.target.closest(".panel")) return;
  const p=toNorm(ev);
  state.drag="ring";
  state.py=p.y;
}
function onMove(ev){
  if(state.drag!=="ring") return;
  ev.preventDefault();
  const p=toNorm(ev);
  state.cy += p.y-state.py;
  state.cy=Math.min(0.92, Math.max(0.18, state.cy));
  state.py=p.y;
}
function onUp(){ state.drag=null; }
document.addEventListener("pointerdown", onDown, {passive:false});
document.addEventListener("pointermove", onMove, {passive:false});
document.addEventListener("pointerup", onUp);
document.addEventListener("touchstart", e=>{
  if(e.target.closest && e.target.closest(".panel")) return;
  const p=toNorm(e.touches[0]); state.drag="ring"; state.py=p.y;
}, {passive:false});
document.addEventListener("touchmove", e=>{
  if(state.drag!=="ring") return;
  e.preventDefault();
  const p=toNorm(e.touches[0]);
  state.cy += p.y-state.py;
  state.cy=Math.min(0.92, Math.max(0.18, state.cy));
  state.py=p.y;
}, {passive:false});
document.addEventListener("touchend", onUp);

function isBallPix(r,g,b){
  const grass=g>r+8 && g>b+6 && g>60 && g<200;
  if(grass) return false;
  return true;
}
function blobIn(img, cx,cy, rad){
  const w=img.width,h=img.height,data=img.data;
  const x0=Math.max(1,(cx-rad)*w|0), x1=Math.min(w-1,(cx+rad)*w|0);
  const y0=Math.max(1,(cy-rad)*h|0), y1=Math.min(h-1,(cy+rad)*h|0);
  let sx=0,sy=0,n=0,minx=w,maxx=0,miny=h,maxy=0,tot=0;
  for(let y=y0;y<y1;y+=1){
    for(let x=x0;x<x1;x+=1){
      if(Math.hypot(x-cx*w, y-cy*h)>rad*w) continue;
      tot++;
      const i=(y*w+x)*4;
      if(!isBallPix(data[i],data[i+1],data[i+2])) continue;
      sx+=x;sy+=y;n++;
      if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y;
    }
  }
  if(n<8) return null;
  const d=Math.max(4, Math.max(maxx-minx,maxy-miny));
  return {x:sx/n/w,y:sy/n/h,d:d/w,n,tot};
}
function findBall(img){
  const inR=blobIn(img, state.cx, state.cy, state.r*1.2);
  if(inR) return Object.assign(inR,{inRing:true});
  if(state.flying && state.lock){
    const px=state.lock.x+(state.vx||0);
    const py=state.lock.y+(state.vy||0);
    const near=blobIn(img, px, py, 0.12);
    if(near && Math.abs(near.x-state.gx)>0.08) return near;
  }
  return null;
}
function inRing(p){return Math.hypot(p.x-state.cx,p.y-state.cy)<state.r*1.2}

function draw(hit){
  const w=cv.width,h=cv.height;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle=PINK; ctx.fillStyle=PINK;
  ctx.lineWidth=4*devicePixelRatio;
  ctx.strokeStyle=state.ready? "#ff2a2a":PINK;
  ctx.fillStyle=ctx.strokeStyle;
  ctx.setLineDash([14*devicePixelRatio,10*devicePixelRatio]);
  ctx.beginPath(); ctx.arc(state.cx*w,state.cy*h,state.r*w,0,Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.font=(12*devicePixelRatio)+"px sans-serif";
  ctx.fillText("2 FT BALL", state.cx*w-36, state.cy*h-state.r*w-8);
  ctx.lineWidth=5*devicePixelRatio;
  ctx.beginPath(); ctx.moveTo(state.gx*w,0); ctx.lineTo(state.gx*w,h); ctx.stroke();
  ctx.fillText("GATE", state.gx*w+8, 28*devicePixelRatio);
  const L=state.lock||hit;
  if(L){
    ctx.beginPath(); ctx.strokeStyle=state.ready?"#ff2a2a":"#7dff6a"; ctx.lineWidth=4*devicePixelRatio;
    const rr=Math.min(state.r*w*0.85, Math.max(8*devicePixelRatio, (L.d||0.03)*w*0.5));
    ctx.arc(L.x*w,L.y*h,rr,0,Math.PI*2); ctx.stroke();
  }
}

function flash(mph){
  $("mph").innerHTML=mph.toFixed(0)+"<span>MPH</span>";
  const prev=state.lastMph, el=$("arrow");
  if(prev==null){el.textContent="→";el.className="arrow same"}
  else if(mph>prev+0.7){el.textContent="↑";el.className="arrow up"}
  else if(mph<prev-0.7){el.textContent="↓";el.className="arrow down"}
  else {el.textContent="→";el.className="arrow same"}
  $("meta").textContent="From frames after it left the ring";
  state.lastMph=mph;
}

function speedFromTrack(){
  const tr=state.track;
  if(tr.length<4) return;
  const a=tr[0], b=tr[tr.length-1];
  const dt=b.t-a.t;
  if(dt<0.07||dt>0.28) return;
  const dx=b.x-a.x, dy=b.y-a.y;
  const toward= (state.gx-state.cx);
  if(toward===0 || dx*toward<=0) return;
  const distN=Math.hypot(dx, dy*(innerHeight/innerWidth));
  const feet=distN/Math.max(state.r,0.02);
  if(feet<2.2) return;
  const mph=(feet/dt)*0.681818;
  if(mph>=10&&mph<=80){
    flash(mph);
    prompt(mph.toFixed(0)+" MPH · put the ball back in the ring");
    state.track=[]; state.ready=false; state.lock=null; state.flying=false; state.vx=0; state.vy=0;
  }
}

function loop(){
  if(!state.live) return;
  if(vid.videoWidth){
    const tw=640, th=Math.round(640*cv.height/cv.width);
    const off=document.createElement("canvas"); off.width=tw; off.height=th;
    const o=off.getContext("2d",{willReadFrequently:true});
    drawCover(o, vid, tw, th, true);
    const frame=o.getImageData(0,0,tw,th);
    const hit=findBall(frame);
    state.prevData=frame.data;
    const t=performance.now()/1000;
    if(hit){
      if(state.lock){
        state.vx=hit.x-state.lock.x;
        state.vy=hit.y-state.lock.y;
      }
      state.lock={x:hit.x,y:hit.y,d:hit.d};
      const inside=inRing(hit);
      if(inside && !state.flying){
        state.seen=(state.seen||0)+1;
        if(state.seen>3){
          state.locked=true; state.ready=true;
          $("lock").className="go";
          prompt("LOCKED ON BALL — kick");
        } else {
          prompt("Ball in ring — locking…");
        }
      } else if(state.ready && Math.abs(hit.x-state.cx)>state.r*0.9){
        const toward=state.gx-state.cx;
        if(toward===0 || (hit.x-state.cx)*toward<=0) { /* ignore motion away from gate */ }
        else {
          state.flying=true;
          state.track.push({t,x:hit.x,y:hit.y});
          prompt("TRACKING");
          if(state.track.length>=4) speedFromTrack();
          if(state.track[0] && t-state.track[0].t>0.32){
            state.track=[]; state.flying=false; state.ready=true;
            prompt("LOCKED ON BALL — kick again");
          }
        }
      }
      state.missT=null;
    } else {
      state.seen=0;
      if(state.lock && state.ready){
        prompt("TRACKING");
        if(!state.missT) state.missT=t;
        if(t-state.missT>0.40){
          state.flying=false; state.track=[]; state.missT=null;
          prompt("Lost it — put the ball in the ring");
          state.lock=null; state.ready=false; state.vx=0; state.vy=0;
        }
      } else if(state.live){
        prompt("Looking for the ball in the ring…");
      }
    }
    draw(hit || state.lock);
  } else draw(null);
  requestAnimationFrame(loop);
}

$("cam").onclick=()=>startCam().catch(()=>alert("Allow camera"));
$("lock").onclick=()=>{
  const go=()=>{
    state.locked=true; state.ready=true; state.seen=99;
    $("lock").className="go";
    prompt("LOCKED — sensor is live. Kick.");
  };
  if(!state.live) startCam().then(go); else go();
};
$("unlock").onclick=()=>{
  state.locked=false; state.ready=false; state.track=[]; state.lock=null; state.flying=false;
  prompt("RECALIBRATE — drag ring and gate, then LOCK");
};
</script>
</body>
</html>
