<!DOCTYPE html>
<!--
KICKLAB LIVE — single file, iPhone Safari, front camera.
One job: live speed of a size-4 ball (0.673 ft) using ball diameter as the only scale.
Flow: start camera → drag pink ring onto ball → auto LOCK when still →
kick left toward red gate → MPH from mark to tracked flight → re-arm when ball returns.
No video upload. No MediaRecorder. No leftover builds.
-->
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<title>KICKLAB LIVE</title>
<style>
  :root{--lime:#c8ff3d;--pink:#ff2ec8;--txt:#f4f6fb}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#05070c;color:var(--txt);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}
  #stage{position:fixed;inset:0}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  video{z-index:1;transform:scaleX(-1)}
  canvas{z-index:2}
  #hud{position:fixed;inset:0;z-index:3;pointer-events:none}
  #hud *{pointer-events:auto}
  .top{position:absolute;top:calc(6px + env(safe-area-inset-top));left:10px;right:10px}
  .brand{letter-spacing:.28em;font-size:10px;color:var(--lime);font-weight:700}
  .panel{background:rgba(8,10,16,.82);border:1px solid #2a3348;border-radius:14px;padding:8px 10px;margin-top:6px;backdrop-filter:blur(10px);max-width:70vw}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
  button{border:0;border-radius:10px;padding:8px 10px;font:inherit;font-weight:800}
  .go{background:var(--lime);color:#111}
  .ghost{background:#0c0f16;color:var(--txt);border:1px solid #2a3348}
  .prompt{margin-top:6px;font-size:15px;font-weight:800;color:var(--lime)}
  .mphwrap{position:absolute;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));text-align:right;pointer-events:none}
  .mph{font-size:84px;font-weight:800;letter-spacing:-.06em;line-height:.85;text-shadow:0 8px 30px #000}
  .mph span{font-size:16px;color:var(--lime);margin-left:6px}
  .arrow{font-size:80px;line-height:.7}
  .up{color:#7dff6a}.down{color:#ff4d4d}.same{color:#e6c35a}
  .sub{color:#d7dce8;font-size:13px}
</style>
</head>
<body>
<div id="stage">
  <video id="vid" playsinline muted autoplay></video>
  <canvas id="cv"></canvas>
</div>
<div id="hud">
  <div class="top">
    <div class="brand">KICKLAB LIVE</div>
    <div class="panel">
      <div class="row">
        <button class="ghost" id="cam">START CAMERA</button>
        <button class="ghost" id="lock">LOCK</button>
        <button class="ghost" id="unlock">RECALIBRATE</button>
      </div>
      <div class="prompt" id="prompt">START CAMERA · drag the ring onto the ball</div>
    </div>
  </div>
  <div class="mphwrap">
    <div class="arrow same" id="arrow">→</div>
    <div class="mph" id="mph">—<span>MPH</span></div>
    <div class="sub" id="meta">Size 4 · live</div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const vid = $("vid"), cv = $("cv");
const ctx = cv.getContext("2d", { willReadFrequently:true });
const buf = document.createElement("canvas");
const btx = buf.getContext("2d", { willReadFrequently:true });
const AW = 400;
const BALL_FT = 0.673;
const PINK = "#ff2ec8";

const S = {
  live:false, phase:"off",
  cx:0.74, cy:0.70, r:0.040, gx:0.20,
  drag:false, quiet:0,
  still:0, miss:0,
  mark:null, path:[],
  lastMph:null, lastY:0
};

function say(t){ $("prompt").textContent = t; }
function clearMph(){
  $("mph").innerHTML = "—<span>MPH</span>";
  $("arrow").textContent = "→";
  $("arrow").className = "arrow same";
}
function fit(){
  cv.width = innerWidth * devicePixelRatio;
  cv.height = innerHeight * devicePixelRatio;
}
addEventListener("resize", fit); fit();

function drawCover(c,w,h){
  const vw=vid.videoWidth, vh=vid.videoHeight;
  if(!vw) return;
  const s=Math.max(w/vw,h/vh);
  const dw=vw*s, dh=vh*s;
  c.save(); c.translate(w,0); c.scale(-1,1);
  c.drawImage(vid,(w-dw)/2,(h-dh)/2,dw,dh);
  c.restore();
}
function snap(){
  const th=Math.max(180, Math.round(AW*cv.height/cv.width));
  if(buf.width!==AW||buf.height!==th){ buf.width=AW; buf.height=th; }
  drawCover(btx,AW,th);
  return btx.getImageData(0,0,AW,th);
}

function isGrass(r,g,b){ return g>r+14 && g>b+8 && g>48; }
function isSkin(r,g,b){
  return r>85 && g>50 && r>b+6 && Math.abs(r-g)<50 && (r+g+b)/3<170;
}
function isBall(r,g,b){
  if(isGrass(r,g,b) || isSkin(r,g,b)) return false;
  const lum=(r+g+b)/3;
  if(lum>155) return true;
  if(r>148 && r>g+26 && r>b+16) return true;
  return false;
}
function isBallFill(r,g,b){
  if(isGrass(r,g,b) || isSkin(r,g,b)) return false;
  if(isBall(r,g,b)) return true;
  const lum=(r+g+b)/3;
  return lum<85 && Math.abs(r-g)<30 && Math.abs(g-b)<30;
}

function blobAt(img, x0,x1,y0,y1){
  const {data,width:w,height:h}=img;
  const xa=Math.max(1,(x0*w)|0), xb=Math.min(w-1,(x1*w)|0);
  const ya=Math.max(1,(y0*h)|0), yb=Math.min(h-1,(y1*h)|0);
  let best=null, bestN=14;
  const step=4;
  for(let y=ya;y<yb;y+=step){
    for(let x=xa;x<xb;x+=step){
      const i=(y*w+x)*4;
      if(!isBall(data[i],data[i+1],data[i+2])) continue;
      let n=0,sx=0,sy=0,minx=w,maxx=0,miny=h,maxy=0;
      const R=11;
      for(let yy=y-R;yy<=y+R;yy+=2){
        if(yy<1||yy>=h-1) continue;
        for(let xx=x-R;xx<=x+R;xx+=2){
          if(xx<1||xx>=w-1) continue;
          const j=(yy*w+xx)*4;
          if(!isBallFill(data[j],data[j+1],data[j+2])) continue;
          n++; sx+=xx; sy+=yy;
          if(xx<minx)minx=xx; if(xx>maxx)maxx=xx;
          if(yy<miny)miny=yy; if(yy>maxy)maxy=yy;
        }
      }
      if(n<=bestN) continue;
      const dw=(maxx-minx)/w, dh=(maxy-miny)/h;
      const d=Math.max(dw,dh);
      if(d<0.016||d>0.10) continue;
      const asp=dw>dh?dw/Math.max(dh,.001):dh/Math.max(dw,.001);
      if(asp>1.5) continue;
      bestN=n;
      best={n,x:sx/n/w,y:sy/n/h,d};
    }
  }
  return best;
}
function inRing(img){
  const p=S.r*1.25;
  return blobAt(img, S.cx-p, S.cx+p, S.cy-p*1.3, S.cy+p*1.3);
}
function inFlight(img){
  if(!S.mark) return null;
  const x0 = S.gx + 0.04;
  const x1 = S.mark.x - 0.10;
  if(x1<=x0) return null;
  const y0 = S.mark.y - 0.16;
  const y1 = S.mark.y + 0.14;
  const hit = blobAt(img, x0, x1, y0, y1);
  if(!hit) return null;
  if(S.mark.d && Math.abs(hit.d - S.mark.d)/S.mark.d > 0.7) return null;
  return hit;
}

function publish(mph){
  mph=Math.round(mph);
  $("mph").innerHTML=mph+"<span>MPH</span>";
  const el=$("arrow");
  if(S.lastMph==null){ el.textContent="→"; el.className="arrow same"; }
  else if(mph>S.lastMph+1){ el.textContent="↑"; el.className="arrow up"; }
  else if(mph<S.lastMph-1){ el.textContent="↓"; el.className="arrow down"; }
  else { el.textContent="→"; el.className="arrow same"; }
  S.lastMph=mph;
  $("meta").textContent="Size 4 · live";
  say(mph+" MPH · ball back on the tee");
  S.phase="done";
}

function score(){
  const p=S.path;
  if(!S.mark || p.length<2) return false;
  const b=p[p.length-1];
  const dt=b.t-S.mark.t;
  if(dt<0.10 || dt>0.70) return false;
  if(b.x > S.mark.x-0.10) return false;
  const aspect=innerHeight/innerWidth;
  const fpp=BALL_FT/Math.max(S.mark.d||0.04,0.018);
  const dist=Math.hypot(b.x-S.mark.x,(b.y-S.mark.y)*aspect)*fpp;
  if(dist<1.8) return false;
  const mph=(dist/dt)*0.681818;
  if(mph<10 || mph>62) return false;
  publish(mph);
  return true;
}

function draw(hit){
  const w=cv.width,h=cv.height;
  ctx.clearRect(0,0,w,h);
  const armed=S.phase==="mark"||S.phase==="fly";
  ctx.strokeStyle=armed?"#ff2a2a":PINK;
  ctx.fillStyle=ctx.strokeStyle;
  ctx.lineWidth=4*devicePixelRatio;
  ctx.setLineDash([14*devicePixelRatio,10*devicePixelRatio]);
  ctx.beginPath(); ctx.arc(S.cx*w,S.cy*h,S.r*w,0,Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.font=(12*devicePixelRatio)+"px sans-serif";
  ctx.fillText("SIZE 4", S.cx*w-22, S.cy*h-S.r*w-8);
  ctx.lineWidth=5*devicePixelRatio;
  ctx.beginPath(); ctx.moveTo(S.gx*w,0); ctx.lineTo(S.gx*w,h); ctx.stroke();
  ctx.fillText("GATE", S.gx*w+8, 26*devicePixelRatio);
  if(hit){
    ctx.strokeStyle=armed?"#ff2a2a":"#7dff6a";
    ctx.beginPath();
    ctx.arc(hit.x*w,hit.y*h,Math.max(8,(hit.d||0.03)*w*0.5),0,Math.PI*2);
    ctx.stroke();
  }
}

function loop(){
  if(!S.live) return;
  if(!vid.videoWidth){ requestAnimationFrame(loop); return; }
  const img=snap();
  const t=performance.now()/1000;
  const quiet=S.drag || performance.now()<S.quiet;
  const ring=inRing(img);

  if(quiet){ draw(ring); requestAnimationFrame(loop); return; }

  if(S.phase==="done"){
    if(ring && ring.n>16){
      S.phase="seek"; S.still=0; S.miss=0; S.path=[];
      say("Ball in ring — hold still");
    }
    draw(ring); requestAnimationFrame(loop); return;
  }

  if(S.phase==="fly"){
    const air=inFlight(img);
    if(air) S.path.push({t,x:air.x,y:air.y});
    if(S.path.length>=2 && (t-S.mark.t)>=0.10){
      if(score()){ draw(air); requestAnimationFrame(loop); return; }
    }
    if(t-S.mark.t > 0.80){
      say("Missed it — ball back on the tee");
      S.phase="done";
    }
    draw(air); requestAnimationFrame(loop); return;
  }

  if(S.phase==="mark"){
    if(ring){
      S.miss=0;
      S.mark.t=t;
      say("ON THE MARK — kick when ready");
      draw(ring);
    } else {
      S.miss++;
      if(S.miss>=4){
        const air=inFlight(img);
        if(!air){ draw(null); requestAnimationFrame(loop); return; }
        S.phase="fly";
        S.path=[{t:S.mark.t,x:S.mark.x,y:S.mark.y},{t,x:air.x,y:air.y}];
        say("KICK — tracking");
      }
      draw(null);
    }
    requestAnimationFrame(loop); return;
  }

  if(S.phase==="seek"){
    if(ring){
      const moved=S.lastY && Math.abs(ring.y-S.lastY)>0.025;
      S.still=moved?0:S.still+1;
      S.lastY=ring.y;
      if(S.still>=5){
        S.mark={x:ring.x,y:ring.y,d:ring.d,t};
        S.phase="mark"; S.miss=0;
        $("lock").className="go";
        clearMph();
        say("ON THE MARK — kick when ready");
      } else say("Ball in ring — hold still");
    } else {
      S.still=0; say("Looking for the ball in the ring…");
    }
    draw(ring);
  }
  requestAnimationFrame(loop);
}

function startCam(){
  if(S.live) return;
  navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{ facingMode:"user", width:{ideal:1280}, height:{ideal:720} }
  }).then(s=>{ vid.srcObject=s; return vid.play(); })
    .then(()=>{
      S.live=true; S.phase="seek";
      $("cam").textContent="CAMERA ON"; $("cam").className="go";
      say("Looking for the ball in the ring…");
      loop();
    }).catch(()=>say("Allow camera in Safari"));
}
function reset(){
  S.phase=S.live?"seek":"off";
  S.still=0; S.miss=0; S.mark=null; S.path=[];
  $("lock").className="ghost";
  clearMph();
  say(S.live?"Looking for the ball in the ring…":"START CAMERA");
}

$("cam").onclick=startCam;
$("unlock").onclick=reset;
$("lock").onclick=()=>{
  if(!S.live){ startCam(); return; }
  const ring=inRing(snap());
  if(!ring){ say("No ball in the ring — drag it onto the ball"); return; }
  S.mark={x:ring.x,y:ring.y,d:ring.d,t:performance.now()/1000};
  S.phase="mark"; S.miss=0;
  $("lock").className="go";
  clearMph();
  say("ON THE MARK — kick when ready");
};

function pt(e){ const t=e.touches?e.touches[0]:e; return {x:t.clientX/innerWidth,y:t.clientY/innerHeight}; }
cv.addEventListener("pointerdown", e=>{
  const p=pt(e);
  if(Math.hypot(p.x-S.cx,p.y-S.cy)<S.r+0.09){
    S.drag="ring"; S.quiet=performance.now()+700;
    try{cv.setPointerCapture(e.pointerId)}catch(_){}
  } else if(Math.abs(p.x-S.gx)<0.07) S.drag="gate";
});
addEventListener("pointermove", e=>{
  if(!S.drag) return;
  const p=pt(e);
  if(S.drag==="ring") S.cy=Math.min(0.92,Math.max(0.40,p.y));
  if(S.drag==="gate") S.gx=Math.min(0.40,Math.max(0.08,p.x));
});
addEventListener("pointerup", ()=>{
  if(S.drag) S.quiet=performance.now()+700;
  S.drag=false;
});
</script>
</body>
</html>
