<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<title>KICKLAB LIVE</title>
<style>
  :root{--lime:#c8ff3d;--pink:#ff2ec8;--dim:#8b93a7;--txt:#f4f6fb}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#05070c;color:var(--txt);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  canvas{z-index:2} video{z-index:1;transform:scaleX(-1)}
  #hud{position:fixed;inset:0;z-index:3;pointer-events:none}
  #hud *{pointer-events:auto}
  .top{position:absolute;top:calc(6px + env(safe-area-inset-top));left:10px;right:10px}
  .brand{letter-spacing:.28em;font-size:10px;color:var(--lime);font-weight:700}
  .panel{background:rgba(8,10,16,.8);border:1px solid #2a3348;border-radius:14px;padding:8px 10px;margin-top:6px;backdrop-filter:blur(10px);max-width:52vw}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
  select,button{border:0;border-radius:10px;padding:8px 10px;font:inherit;font-weight:800}
  select{background:#0c0f16;color:var(--txt);border:1px solid #2a3348;font-weight:600}
  .go{background:var(--lime);color:#111}
  .ghost{background:#0c0f16;color:var(--txt);border:1px solid #2a3348}
  .prompt{margin-top:6px;font-size:15px;font-weight:800;letter-spacing:.04em;color:var(--lime)}
  .mphwrap{position:absolute;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));text-align:right;pointer-events:none}
  .mph{font-size:84px;font-weight:800;letter-spacing:-.06em;line-height:.85;text-shadow:0 8px 30px #000}
  .mph span{font-size:16px;color:var(--lime);margin-left:6px}
  .arrow{font-size:90px;line-height:.65}.up{color:#7dff6a}.down{color:#ff4d4d}.same{color:#e6c35a}
  .sub{color:#d7dce8;font-size:13px}
</style>
</head>
<body>
<div id="stage"><video id="vid" playsinline muted autoplay></video><canvas id="cv"></canvas></div>
<div id="hud">
  <div class="top">
    <div class="brand">KICKLAB LIVE</div>
    <div class="panel" id="cal">
      <div class="row">
        <select id="size"><option value="0.205" selected>Size 4</option></select>
        <button class="ghost" id="cam">START CAMERA</button>
        <button class="go" id="lock">LOCK</button>
        <button class="ghost" id="unlock">RECALIBRATE</button>
      </div>
      <div class="prompt" id="prompt">START CAMERA · put the ball in the pink ring</div>
    </div>
  </div>
  <div class="mphwrap" id="readout">
    <div class="arrow same" id="arrow">→</div>
    <div class="mph" id="mph">—<span>MPH</span></div>
    <div class="sub" id="meta">Speed from frames · 2-FT ring is the ruler</div>
  </div>
</div>
<script>
const vid=$("vid"), cv=$("cv"), ctx=cv.getContext("2d",{willReadFrequently:true});
function $(id){return document.getElementById(id)}
const PINK="#ff2ec8";
const state={live:false,locked:false,cx:0.72,cy:0.62,r:0.08,gx:0.22,drag:null,lastMph:null,track:[],ready:false,prevData:null};
function resize(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
addEventListener("resize",resize); resize();
function prompt(t){$("prompt").textContent=t}

async function startCam(){
  const s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:"user",width:{ideal:1280},height:{ideal:720},frameRate:{ideal:60}}});
  vid.srcObject=s; await vid.play(); state.live=true; prompt("Place the ball inside the pink ring"); loop();
}

function toNorm(ev){const r=cv.getBoundingClientRect();return {x:(ev.clientX-r.left)/r.width,y:(ev.clientY-r.top)/r.height}}
cv.addEventListener("pointerdown",ev=>{
  if(state.locked) return;
  const p=toNorm(ev);
  const dist=Math.hypot(p.x-state.cx,p.y-state.cy);
  if(Math.abs(dist-state.r)<0.04) state.drag="size";
  else if(dist<state.r*1.4) state.drag="ring";
  else state.drag="gate";
  state.px=p.x; state.py=p.y;
});
cv.addEventListener("pointermove",ev=>{
  if(!state.drag||state.locked) return;
  const p=toNorm(ev), dx=p.x-state.px, dy=p.y-state.py;
  if(state.drag==="ring"){state.cx+=dx;state.cy+=dy}
  if(state.drag==="gate"){state.gx+=dx}
  if(state.drag==="size"){state.r=Math.min(0.2,Math.max(0.04,Math.hypot(p.x-state.cx,p.y-state.cy)))}
  state.px=p.x; state.py=p.y;
});
addEventListener("pointerup",()=>state.drag=null);

function blobIn(img, cx,cy, rad, prev){
  const w=img.width,h=img.height,data=img.data;
  const x0=Math.max(0,(cx-rad)*w|0), x1=Math.min(w,(cx+rad)*w|0);
  const y0=Math.max(0,(cy-rad)*h|0), y1=Math.min(h,(cy+rad)*h|0);
  let sx=0,sy=0,n=0,minx=w,maxx=0,miny=h,maxy=0;
  for(let y=y0;y<y1;y+=2){
    for(let x=x0;x<x1;x+=2){
      const nx=x/w, ny=y/h;
      if(Math.hypot(nx-cx,ny-cy)>rad) continue;
      const i=(y*w+x)*4;
      let on=false;
      if(prev){
        const d=Math.abs(data[i]-prev[i])+Math.abs(data[i+1]-prev[i+1])+Math.abs(data[i+2]-prev[i+2]);
        on=d>70;
      } else {
        const r=data[i],g=data[i+1],b=data[i+2];
        const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
        on=(mx-mn)>28 || mx>170 || mx<70;
      }
      if(on){ sx+=x;sy+=y;n++; if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y; }
    }
  }
  if(n<14) return null;
  const d=Math.max(maxx-minx,maxy-miny);
  if(d<6||d>rad*w*2.2) return null;
  return {x:sx/n/w,y:sy/n/h,d:d/w};
}
function findBall(img){
  if(state.ready && state.track.length){
    const last=state.track[state.track.length-1];
    return blobIn(img, last.x, last.y, 0.14, state.prevData);
  }
  return blobIn(img, state.cx, state.cy, state.r*1.15, state.prevData);
}
function inRing(p){return Math.hypot(p.x-state.cx,p.y-state.cy)<state.r*1.2}

function draw(hit){
  const w=cv.width,h=cv.height;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle=PINK; ctx.fillStyle=PINK;
  ctx.lineWidth=4*devicePixelRatio;
  ctx.setLineDash([14*devicePixelRatio,10*devicePixelRatio]);
  ctx.beginPath(); ctx.arc(state.cx*w,state.cy*h,state.r*w,0,Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.font=(12*devicePixelRatio)+"px sans-serif";
  ctx.fillText("2 FT BALL", state.cx*w-36, state.cy*h-state.r*w-8);
  ctx.lineWidth=5*devicePixelRatio;
  ctx.beginPath(); ctx.moveTo(state.gx*w,0); ctx.lineTo(state.gx*w,h); ctx.stroke();
  ctx.fillText("GATE", state.gx*w+8, 28*devicePixelRatio);
  if(hit){
    ctx.beginPath(); ctx.strokeStyle=state.ready?"#7dff6a":"#fff";
    ctx.arc(hit.x*w,hit.y*h,Math.max(8,hit.d*w/2),0,Math.PI*2); ctx.stroke();
  }
}

function flash(mph){
  $("mph").innerHTML=mph.toFixed(0)+"<span>MPH</span>";
  const prev=state.lastMph, el=$("arrow");
  if(prev==null){el.textContent="→";el.className="arrow same"}
  else if(mph>prev+0.7){el.textContent="↑";el.className="arrow up"}
  else if(mph<prev-0.7){el.textContent="↓";el.className="arrow down"}
  else {el.textContent="→";el.className="arrow same"}
  $("meta").textContent="From frames after it left the ring";
  state.lastMph=mph;
}

function speedFromTrack(){
  const tr=state.track;
  if(tr.length<3) return;
  const a=tr[0], b=tr[tr.length-1];
  const dt=b.t-a.t;
  if(dt<0.06||dt>0.22) return;
  const dx=b.x-a.x, dy=b.y-a.y;
  const distN=Math.hypot(dx, dy*(innerHeight/innerWidth));
  const feet=distN/Math.max(state.r,0.02);
  const mph=(feet/dt)*0.681818;
  if(mph>=8&&mph<=80){ flash(mph); prompt(mph.toFixed(0)+" MPH · put the ball back in the ring"); state.track=[]; state.ready=false; }
}

function loop(){
  if(!state.live) return;
  if(vid.videoWidth){
    const tw=480, th=Math.round(480*vid.videoHeight/vid.videoWidth);
    const off=document.createElement("canvas"); off.width=tw; off.height=th;
    const o=off.getContext("2d",{willReadFrequently:true});
    o.save(); o.translate(tw,0); o.scale(-1,1); o.drawImage(vid,0,0,tw,th); o.restore();
    const frame=o.getImageData(0,0,tw,th);
    const hit=findBall(frame);
    state.prevData=frame.data;
    const t=performance.now()/1000;
    if(state.locked){
      if(hit && inRing(hit)){
        state.ready=true; state.track=[];
        prompt("READY TO KICK");
      } else if(state.ready && hit && !inRing(hit)){
        state.track.push({t,x:hit.x,y:hit.y});
        prompt("TRACKING");
        if(state.track.length>=3) speedFromTrack();
        if(state.track.length && t-state.track[0].t>0.25){ state.track=[]; state.ready=false; prompt("Put the ball in the ring"); }
      } else if(!hit){
        if(!state.ready) prompt("Looking for the ball in the ring…");
      }
    }
    draw(hit && ( !state.locked || state.ready || inRing(hit) ) ? hit : (state.locked?null:hit));
  } else draw(null);
  requestAnimationFrame(loop);
}

$("cam").onclick=()=>startCam().catch(()=>alert("Allow camera"));
$("lock").onclick=()=>{
  if(!state.live) startCam().then(()=>{state.locked=true;prompt("Place the ball in the ring")});
  else {state.locked=true;prompt("Place the ball in the ring")}
};
$("unlock").onclick=()=>{
  state.locked=false; state.ready=false; state.track=[];
  prompt("RECALIBRATE — drag ring and gate, then LOCK");
};
</script>
</body>
</html>
