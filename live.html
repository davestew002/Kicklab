<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<title>KICKLAB LIVE</title>
<style>
  :root{--lime:#c8ff3d;--pink:#ff2ec8;--txt:#f4f6fb}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#05070c;color:var(--txt);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}
  #stage{position:fixed;inset:0;z-index:1;touch-action:none}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  video{z-index:1;transform:scaleX(-1)}
  canvas{z-index:2}
  #hud{position:fixed;inset:0;z-index:3;pointer-events:none}
  #hud *{pointer-events:auto}
  .top{position:absolute;top:calc(6px + env(safe-area-inset-top));left:10px;right:10px}
  .brand{letter-spacing:.28em;font-size:10px;color:var(--lime);font-weight:700}
  .panel{background:rgba(8,10,16,.8);border:1px solid #2a3348;border-radius:14px;padding:8px 10px;margin-top:6px;backdrop-filter:blur(10px);max-width:56vw}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
  select,button{border:0;border-radius:10px;padding:8px 10px;font:inherit;font-weight:800}
  select{background:#0c0f16;color:var(--txt);border:1px solid #2a3348;font-weight:600}
  .go{background:var(--lime);color:#111}
  .ghost{background:#0c0f16;color:var(--txt);border:1px solid #2a3348}
  .prompt{margin-top:6px;font-size:15px;font-weight:800;letter-spacing:.04em;color:var(--lime)}
  .mphwrap{position:absolute;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));text-align:right;pointer-events:none}
  .mph{font-size:84px;font-weight:800;letter-spacing:-.06em;line-height:.85;text-shadow:0 8px 30px #000}
  .mph span{font-size:16px;color:var(--lime);margin-left:6px}
  .arrow{font-size:90px;line-height:.65}
  .up{color:#7dff6a}.down{color:#ff4d4d}.same{color:#e6c35a}
  .sub{color:#d7dce8;font-size:13px}
</style>
</head>
<body>
<div id="stage">
  <video id="vid" playsinline muted autoplay></video>
  <canvas id="cv"></canvas>
</div>
<div id="hud">
  <div class="top">
    <div class="brand">KICKLAB LIVE</div>
    <div class="panel">
      <div class="row">
        <select id="size"><option value="0.205" selected>Size 4</option></select>
        <button class="ghost" id="cam">START CAMERA</button>
        <button class="ghost" id="lock">LOCK</button>
        <button class="ghost" id="unlock">RECALIBRATE</button>
      </div>
      <div class="prompt" id="prompt">START CAMERA · put the ball in the pink ring</div>
    </div>
  </div>
  <div class="mphwrap">
    <div class="arrow same" id="arrow">→</div>
    <div class="mph" id="mph">—<span>MPH</span></div>
    <div class="sub" id="meta">Size 4 ball is the ruler</div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const vid = $("vid");
const cv = $("cv");
const ctx = cv.getContext("2d", { willReadFrequently: true });
const analyze = document.createElement("canvas");
const actx = analyze.getContext("2d", { willReadFrequently: true });

const BALL_FT = 0.673;
const RING_R = 0.042;
const PINK = "#ff2ec8";

const S = {
  live: false,
  phase: "off",
  cx: 0.74, cy: 0.68, r: RING_R,
  gx: 0.22,
  drag: false,
  quietUntil: 0,
  lastY: 0,
  still: 0,
  mark: null,
  ball: null,
  lastMph: null,
  flyStart: 0,
  fillLock: 0
};

function resize(){
  cv.width  = innerWidth  * devicePixelRatio;
  cv.height = innerHeight * devicePixelRatio;
}
addEventListener("resize", resize);
resize();

function say(t){ $("prompt").textContent = t; }

function resetSeek(){
  S.phase = S.live ? "seek" : "off";
  S.still = 0;
  S.mark = null;
  S.ball = null;
  S.fillLock = 0;
  $("lock").className = "ghost";
}

function drawCover(c, video, W, H){
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return;
  const scale = Math.max(W / vw, H / vh);
  const dw = vw * scale, dh = vh * scale;
  const ox = (W - dw) / 2, oy = (H - dh) / 2;
  c.save();
  c.translate(W, 0);
  c.scale(-1, 1);
  c.drawImage(video, W - ox - dw, oy, dw, dh);
  c.restore();
}

async function startCam(){
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 60 } }
  });
  vid.srcObject = stream;
  await vid.play();
  S.live = true;
  S.phase = "seek";
  say("Place the ball in the pink ring and hold still");
  loop();
}

function toNorm(ev){
  const r = cv.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / r.width, y: (ev.clientY - r.top) / r.height };
}
function nearRing(p){
  return Math.hypot(p.x - S.cx, (p.y - S.cy) * 0.6) < S.r * 4;
}
function onDown(ev){
  if (ev.target.closest && ev.target.closest(".panel")) return;
  const p = toNorm(ev.touches ? ev.touches[0] : ev);
  if (!nearRing(p)) return;
  S.drag = true;
  S.lastY = p.y;
  resetSeek();
  S.phase = "seek";
}
function onMove(ev){
  if (!S.drag) return;
  ev.preventDefault();
  const p = toNorm(ev.touches ? ev.touches[0] : ev);
  S.cy = Math.min(0.92, Math.max(0.18, S.cy + (p.y - S.lastY)));
  S.lastY = p.y;
}
function onUp(){
  if (!S.drag) return;
  S.drag = false;
  S.quietUntil = performance.now() + 700;
  say("Ring set — ball in the ring, hold still");
}
document.addEventListener("pointerdown", onDown, { passive: false });
document.addEventListener("pointermove", onMove, { passive: false });
document.addEventListener("pointerup", onUp);
document.addEventListener("touchstart", onDown, { passive: false });
document.addEventListener("touchmove", onMove, { passive: false });
document.addEventListener("touchend", onUp);

function isBallPix(r, g, b){
  if (g > r + 14 && g > b + 10 && g > 55) return false;
  const lum = (r + g + b) / 3;
  if (lum > 150) return true;
  if (r > 140 && r > g + 20) return true;
  return lum > 110;
}

function ringFill(img){
  const w = img.width, h = img.height, data = img.data;
  const rad = S.r * w;
  const cx = S.cx * w, cy = S.cy * h;
  const x0 = Math.max(1, (S.cx - S.r) * w | 0);
  const x1 = Math.min(w - 1, (S.cx + S.r) * w | 0);
  const y0 = Math.max(1, (S.cy - S.r * 1.4) * h | 0);
  const y1 = Math.min(h - 1, (S.cy + S.r * 1.4) * h | 0);
  let n = 0, sx = 0, sy = 0, minx = w, maxx = 0, miny = h, maxy = 0;
  for (let y = y0; y < y1; y++){
    for (let x = x0; x < x1; x++){
      if (Math.hypot(x - cx, y - cy) > rad) continue;
      const i = (y * w + x) * 4;
      if (!isBallPix(data[i], data[i + 1], data[i + 2])) continue;
      n++; sx += x; sy += y;
      if (x < minx) minx = x; if (x > maxx) maxx = x;
      if (y < miny) miny = y; if (y > maxy) maxy = y;
    }
  }
  if (n < 20) return { n: 0 };
  return {
    n,
    x: sx / n / w,
    y: sy / n / h,
    d: Math.max(maxx - minx, maxy - miny) / w
  };
}

function findLeft(img){
  const w = img.width, h = img.height, data = img.data;
  const step = 6;
  let best = null, bestN = 0;
  const y0 = Math.max(1, (0.22 * h) | 0);
  const y1 = Math.min(h - 1, (0.90 * h) | 0);
  const x1 = Math.max(2, ((S.cx - 0.06) * w) | 0);
  for (let y = y0; y < y1; y += step){
    for (let x = 4; x < x1; x += step){
      const i = (y * w + x) * 4;
      if (!isBallPix(data[i], data[i + 1], data[i + 2])) continue;
      let n = 0, sx = 0, sy = 0, minx = w, maxx = 0, miny = h, maxy = 0;
      const xA = Math.max(1, x - 18), xB = Math.min(w - 1, x + 18);
      const yA = Math.max(1, y - 18), yB = Math.min(h - 1, y + 18);
      for (let yy = yA; yy < yB; yy++){
        for (let xx = xA; xx < xB; xx++){
          const j = (yy * w + xx) * 4;
          if (!isBallPix(data[j], data[j + 1], data[j + 2])) continue;
          n++; sx += xx; sy += yy;
          if (xx < minx) minx = xx; if (xx > maxx) maxx = xx;
          if (yy < miny) miny = yy; if (yy > maxy) maxy = yy;
        }
      }
      if (n < 30) continue;
      const dw = (maxx - minx) / w, dh = (maxy - miny) / h;
      const d = Math.max(dw, dh);
      if (d < 0.016 || d > 0.10) continue;
      if (n > bestN){
        bestN = n;
        best = { x: sx / n / w, y: sy / n / h, d };
      }
    }
  }
  return best;
}

function publish(mph){
  mph = Math.round(mph);
  $("mph").innerHTML = mph + "<span>MPH</span>";
  const el = $("arrow");
  if (S.lastMph == null){ el.textContent = "→"; el.className = "arrow same"; }
  else if (mph > S.lastMph + 1){ el.textContent = "↑"; el.className = "arrow up"; }
  else if (mph < S.lastMph - 1){ el.textContent = "↓"; el.className = "arrow down"; }
  else { el.textContent = "→"; el.className = "arrow same"; }
  $("meta").textContent = "Mark to first airborne · size 4 ruler";
  S.lastMph = mph;
  say(mph + " MPH · put the ball back in the ring");
  S.phase = "done";
}

function scoreHit(hit, t){
  if (!S.mark || !hit) return false;
  const dt = t - S.mark.t;
  if (dt < 0.05 || dt > 0.60) return false;
  if (hit.x > S.mark.x - 0.05) return false;
  const aspect = innerHeight / innerWidth;
  const fpp = BALL_FT / Math.max(S.mark.d || hit.d || 0.04, 0.016);
  const dist = Math.hypot(hit.x - S.mark.x, (hit.y - S.mark.y) * aspect) * fpp;
  const mph = (dist / dt) * 0.681818;
  if (mph < 12 || mph > 85) return false;
  publish(mph);
  return true;
}

function draw(hit){
  const w = cv.width, h = cv.height;
  ctx.clearRect(0, 0, w, h);
  const armed = S.phase === "mark" || S.phase === "fly";
  ctx.strokeStyle = armed ? "#ff2a2a" : PINK;
  ctx.fillStyle = ctx.strokeStyle;
  ctx.lineWidth = 4 * devicePixelRatio;
  ctx.setLineDash([14 * devicePixelRatio, 10 * devicePixelRatio]);
  ctx.beginPath();
  ctx.arc(S.cx * w, S.cy * h, S.r * w, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = (12 * devicePixelRatio) + "px sans-serif";
  ctx.fillText("SIZE 4", S.cx * w - 24, S.cy * h - S.r * w - 8);
  ctx.lineWidth = 5 * devicePixelRatio;
  ctx.beginPath();
  ctx.moveTo(S.gx * w, 0);
  ctx.lineTo(S.gx * w, h);
  ctx.stroke();
  ctx.fillText("GATE", S.gx * w + 8, 28 * devicePixelRatio);
  const L = hit || S.ball;
  if (L && L.x != null){
    ctx.strokeStyle = armed ? "#ff2a2a" : "#7dff6a";
    ctx.lineWidth = 4 * devicePixelRatio;
    const rr = Math.min(S.r * w * 0.85, Math.max(8 * devicePixelRatio, (L.d || 0.03) * w * 0.5));
    ctx.beginPath();
    ctx.arc(L.x * w, L.y * h, rr, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function loop(){
  if (!S.live) return;
  if (vid.videoWidth){
    const tw = 480, th = Math.round(480 * cv.height / cv.width);
    if (analyze.width !== tw || analyze.height !== th){
      analyze.width = tw; analyze.height = th;
    }
    drawCover(actx, vid, tw, th);
    const frame = actx.getImageData(0, 0, tw, th);
    const t = performance.now() / 1000;
    const quiet = S.drag || performance.now() < S.quietUntil;
    const fill = ringFill(frame);

    if (quiet){
      draw(fill.n ? fill : null);
      requestAnimationFrame(loop);
      return;
    }

    if (S.phase === "done"){
      if (fill.n > 40 && fill.n > S.fillLock * 0.5){
        S.phase = "seek";
        S.still = 0;
        say("Ball in ring — hold still");
      }
      draw(fill.n ? fill : null);
      requestAnimationFrame(loop);
      return;
    }

    if (S.phase === "fly"){
      const air = findLeft(frame);
      if (air){
        S.ball = air;
        if (scoreHit(air, t)){
          draw(air);
          requestAnimationFrame(loop);
          return;
        }
      }
      if (t - S.flyStart > 0.70){
        say("Missed the flight — ball back in the ring");
        S.phase = "done";
      }
      draw(air);
      requestAnimationFrame(loop);
      return;
    }

    if (S.phase === "mark"){
      if (fill.n > S.fillLock * 0.45 && fill.n > 25){
        S.ball = fill;
        say("ON THE MARK — kick when ready");
      } else {
        S.phase = "fly";
        S.flyStart = t;
        say("KICK — left the mark");
        const air = findLeft(frame);
        if (air){
          S.ball = air;
          scoreHit(air, t);
        }
      }
    } else if (fill.n > 35 && fill.d > 0.018 && fill.d < 0.11){
      S.ball = fill;
      S.still++;
      if (S.still >= 5){
        S.mark = { x: fill.x, y: fill.y, d: fill.d, t };
        S.fillLock = fill.n;
        S.phase = "mark";
        $("lock").className = "go";
        say("ON THE MARK — kick when ready");
      } else {
        say("Ball in ring — hold still…");
      }
    } else {
      S.still = 0;
      S.ball = null;
      say("Looking for the ball in the ring…");
    }
    draw(fill.n ? fill : S.ball);
  } else {
    draw(null);
  }
  requestAnimationFrame(loop);
}

$("cam").onclick = () => startCam().catch(() => alert("Allow camera"));
$("lock").onclick = () => {
  const arm = () => {
    if (S.ball) S.mark = { x: S.ball.x, y: S.ball.y, d: S.ball.d, t: performance.now() / 1000 };
    else S.mark = { x: S.cx, y: S.cy, d: S.r * 1.1, t: performance.now() / 1000 };
    S.fillLock = 80;
    S.phase = "mark";
    S.still = 99;
    $("lock").className = "go";
    say("ON THE MARK — kick when ready");
  };
  if (!S.live) startCam().then(arm); else arm();
};
$("unlock").onclick = () => {
  resetSeek();
  say("RECALIBRATE — drag the ring onto the ball");
};
</script>
</body>
</html>
