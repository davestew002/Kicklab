<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>KICKLAB LIVE</title>
<style>
  :root{--lime:#c8ff3d;--pink:#ff2ec8;--dim:#8b93a7;--txt:#f4f6fb}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#05070c;color:var(--txt);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  canvas{z-index:2}
  video{z-index:1;transform:scaleX(-1)}
  #hud{position:fixed;inset:0;z-index:3;pointer-events:none}
  #hud *{pointer-events:auto}
  .top{position:absolute;top:calc(6px + env(safe-area-inset-top));left:10px;right:10px}
  .brand{letter-spacing:.28em;font-size:10px;color:var(--lime);font-weight:700}
  .panel{background:rgba(8,10,16,.78);border:1px solid #2a3348;border-radius:14px;padding:8px 10px;margin-top:6px;backdrop-filter:blur(10px)}
  @media (orientation:landscape){
    .panel{max-width:46vw}
    .mph{font-size:78px !important}
  }
  label{display:inline;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-right:6px}
  select,button{border:0;border-radius:10px;padding:8px 10px;font:inherit}
  select{background:#0c0f16;color:var(--txt);border:1px solid #2a3348}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
  .go{background:var(--lime);color:#111;font-weight:800}
  .ghost{background:#0c0f16;color:var(--txt);border:1px solid #2a3348;font-weight:800}
  .mphwrap{position:absolute;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));text-align:right;pointer-events:none}
  .mph{font-size:84px;font-weight:800;letter-spacing:-.06em;line-height:.85;text-shadow:0 8px 30px #000}
  .mph span{font-size:16px;color:var(--lime);margin-left:6px}
  .arrow{font-size:90px;line-height:.65;opacity:.85}
  .up{color:#7dff6a}.down{color:#ff4d4d}.same{color:#e6c35a}
  .sub{color:#d7dce8;font-size:13px}
  .step{font-size:12px;line-height:1.35;color:#d7dce8}
</style>
</head>
<body>
<div id="stage">
  <video id="vid" playsinline muted autoplay></video>
  <canvas id="cv"></canvas>
</div>
<div id="hud">
  <div class="top">
    <div class="brand">KICKLAB LIVE · LANDSCAPE</div>
    <div class="panel" id="cal">
      <div class="step">Turn the phone sideways. Drag the PINK RING and the GATE separately (up/down/sideways). Gate is left. Ball is right. Gate is a tight window.</div>
      <div class="row">
        <select id="ball"><option value="white">White ball</option><option value="lime">Lime ball</option></select>
        <select id="size"><option value="0.205" selected>Size 4</option><option value="0.191">Size 3</option><option value="0.220">Size 5</option></select>
        <button class="ghost" id="cam">START CAMERA</button>
        <button class="go" id="lock">LOCK CALIBRATION</button>
      </div>
    </div>
  </div>
  <div class="mphwrap" id="readout" style="display:none">
    <div class="arrow same" id="arrow">→</div>
    <div class="mph" id="mph">—<span>MPH</span></div>
    <div class="sub" id="meta">Waiting for the gate</div>
  </div>
</div>
<script>
const vid=$("vid"), cv=$("cv"), ctx=cv.getContext("2d",{willReadFrequently:true});
function $(id){return document.getElementById(id)}
const state={
  live:false, locked:false,
  cx:0.72, cy:0.62, r:0.08,
  gx:0.18, gy:0.58,
  drag:null, lastMph:null, t0:null
};
const PINK="#ff2ec8";
function resize(){
  cv.width=innerWidth*devicePixelRatio;
  cv.height=innerHeight*devicePixelRatio;
}
addEventListener("resize", resize); resize();
try{ screen.orientation && screen.orientation.lock("landscape").catch(()=>{}); }catch(e){}

async function startCam(){
  const stream=await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{ facingMode:"user", width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:60} }
  });
  vid.srcObject=stream; await vid.play(); state.live=true; loop();
}

function gateBox(){
  const d=state.r*2;
  return {x:state.gx, y:state.gy, w:d*0.18, h:d*0.45};
}

function toNorm(ev){
  const r=cv.getBoundingClientRect();
  return {x:(ev.clientX-r.left)/r.width, y:(ev.clientY-r.top)/r.height};
}
function hitGate(p){
  const g=gateBox();
  return Math.abs(p.x-g.x)<g.w*1.6 && Math.abs(p.y-g.y)<g.h*1.6;
}
cv.addEventListener("pointerdown", ev=>{
  if(state.locked) return;
  const p=toNorm(ev);
  const dist=Math.hypot(p.x-state.cx,p.y-state.cy);
  if(Math.abs(dist-state.r)<0.035) state.drag="size";
  else if(dist<state.r*1.35) state.drag="ring";
  else if(hitGate(p)) state.drag="gate";
  else state.drag="ring";
  state.px=p.x; state.py=p.y;
});
cv.addEventListener("pointermove", ev=>{
  if(!state.drag||state.locked) return;
  const p=toNorm(ev);
  const dx=p.x-state.px, dy=p.y-state.py;
  if(state.drag==="ring"){ state.cx+=dx; state.cy+=dy; }
  if(state.drag==="gate"){ state.gx+=dx; state.gy+=dy; }
  if(state.drag==="size"){ state.r=Math.min(0.18, Math.max(0.035, Math.hypot(p.x-state.cx,p.y-state.cy))); }
  state.px=p.x; state.py=p.y;
});
addEventListener("pointerup", ()=> state.drag=null);

function isTarget(r,g,b){
  if($("ball").value==="white") return r>165&&g>155&&b>140&&Math.abs(r-g)<45;
  return (g>115&&r>55&&b<155&&(g+r)>200&&g>b+12);
}
function findBall(img){
  const w=img.width,h=img.height,data=img.data;
  let sx=0,sy=0,n=0,minx=w,maxx=0,miny=h,maxy=0;
  for(let y=(h*0.12)|0;y<h*0.9;y+=2){
    for(let x=(w*0.04)|0;x<w*0.96;x+=2){
      const i=(y*w+x)*4;
      if(isTarget(data[i],data[i+1],data[i+2])){
        sx+=x;sy+=y;n++;
        if(x<minx)minx=x; if(x>maxx)maxx=x;
        if(y<miny)miny=y; if(y>maxy)maxy=y;
      }
    }
  }
  if(n<12) return null;
  const d=Math.max(maxx-minx,maxy-miny);
  if(d<6||d>90) return null;
  return {x:sx/n/w, y:sy/n/h, d:d/w};
}
function inGate(p,g){ return p.x>g.x-g.w && p.x<g.x+g.w && p.y>g.y-g.h && p.y<g.y+g.h; }
function inRing(p){ return Math.hypot(p.x-state.cx,p.y-state.cy)<state.r*1.25; }

function draw(hit, hot){
  const w=cv.width,h=cv.height;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle=PINK; ctx.fillStyle=PINK;
  ctx.lineWidth=4*devicePixelRatio;
  ctx.setLineDash([14*devicePixelRatio,10*devicePixelRatio]);
  ctx.beginPath(); ctx.arc(state.cx*w,state.cy*h,state.r*w,0,Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.font=(12*devicePixelRatio)+"px sans-serif";
  ctx.fillText("2 FT BALL", state.cx*w-40, state.cy*h-state.r*w-10);
  const g=gateBox();
  ctx.strokeStyle=hot?"#7dff6a":PINK;
  ctx.lineWidth=(hot?6:3)*devicePixelRatio;
  ctx.strokeRect((g.x-g.w)*w,(g.y-g.h)*h,g.w*2*w,g.h*2*h);
  ctx.fillStyle=hot?"#7dff6a":PINK;
  ctx.fillText("8 FT GATE", (g.x-g.w)*w, (g.y-g.h)*h-8);
  if(hit){
    ctx.beginPath(); ctx.strokeStyle="#fff";
    ctx.arc(hit.x*w,hit.y*h,Math.max(8,hit.d*w/2),0,Math.PI*2); ctx.stroke();
  }
}
function flash(mph){
  $("readout").style.display="block";
  $("mph").innerHTML=mph.toFixed(0)+"<span>MPH</span>";
  const prev=state.lastMph, el=$("arrow");
  if(prev==null){ el.textContent="→"; el.className="arrow same"; }
  else if(mph>prev+0.7){ el.textContent="↑"; el.className="arrow up"; }
  else if(mph<prev-0.7){ el.textContent="↓"; el.className="arrow down"; }
  else { el.textContent="→"; el.className="arrow same"; }
  $("meta").textContent=prev==null?"FIRST KICK":(mph>prev?"FASTER":mph<prev?"SLOWER":"SAME");
  state.lastMph=mph;
}
function loop(){
  if(!state.live) return;
  if(vid.videoWidth){
    const tw=480, th=Math.round(480*vid.videoHeight/vid.videoWidth);
    const off=document.createElement("canvas");
    off.width=tw; off.height=th;
    const o=off.getContext("2d",{willReadFrequently:true});
    o.save(); o.translate(tw,0); o.scale(-1,1); o.drawImage(vid,0,0,tw,th); o.restore();
    const hit=state.locked? findBall(o.getImageData(0,0,tw,th)): null;
    const g=gateBox();
    const hot=hit && inGate(hit,g);
    draw(hit,hot);
    if(state.locked && hit){
      const t=performance.now()/1000;
      if(inRing(hit)) state.t0=t;
      if(hot && state.t0 && t-state.t0>0.04 && t-state.t0<1.2){
        const mph=(8/(t-state.t0))*0.681818;
        if(mph>=8 && mph<=80){ flash(mph); state.t0=null; }
      }
    }
  } else draw(null,false);
  requestAnimationFrame(loop);
}
$("cam").onclick=()=>startCam().catch(()=>alert("Allow camera"));
$("lock").onclick=()=>{
  if(!state.live) startCam().then(()=>{state.locked=true;$("cal").style.opacity=.3;$("readout").style.display="block";});
  else { state.locked=true; $("cal").style.opacity=.3; $("readout").style.display="block"; }
};
</script>
</body>
</html>
