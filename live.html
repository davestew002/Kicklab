<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<title>KICKLAB</title>
<style>
  :root{--lime:#c8ff3d;--pink:#ff2ec8;--txt:#f4f6fb}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#05070c;color:var(--txt);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;z-index:1}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #live{z-index:1;transform:scaleX(-1)}
  #cv{z-index:2;pointer-events:none}
  #hud{position:fixed;inset:0;z-index:3;pointer-events:none}
  #hud *{pointer-events:auto}
  .top{position:absolute;top:calc(6px + env(safe-area-inset-top));left:10px;right:10px}
  .brand{letter-spacing:.28em;font-size:10px;color:var(--lime);font-weight:700}
  .panel{background:rgba(8,10,16,.86);border:1px solid #2a3348;border-radius:14px;padding:8px 10px;margin-top:6px;backdrop-filter:blur(10px);max-width:92vw}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
  select,button,label.btn{border:0;border-radius:10px;padding:8px 10px;font:inherit;font-weight:800;display:inline-block}
  select{background:#0c0f16;color:var(--txt);border:1px solid #2a3348;font-weight:600}
  .go{background:var(--lime);color:#111}
  .rec{background:#ff2a2a;color:#fff}
  .ghost{background:#0c0f16;color:var(--txt);border:1px solid #2a3348}
  .prompt{margin-top:6px;font-size:15px;font-weight:800;color:var(--lime)}
  .mphwrap{position:absolute;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));text-align:right;pointer-events:none}
  .mph{font-size:84px;font-weight:800;letter-spacing:-.06em;line-height:.85;text-shadow:0 8px 30px #000}
  .mph span{font-size:16px;color:var(--lime);margin-left:6px}
  .sub{color:#d7dce8;font-size:13px}
  #file{display:none}
  .dot{width:10px;height:10px;border-radius:50%;background:#ff2a2a;display:inline-block;margin-right:6px;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.3}}
</style>
</head>
<body>
<div id="stage">
  <video id="live" playsinline muted autoplay></video>
  <canvas id="cv"></canvas>
</div>
<div id="hud">
  <div class="top">
    <div class="brand">KICKLAB</div>
    <div class="panel">
      <div class="row">
        <select id="size"><option selected>Size 4</option></select>
        <button class="ghost" id="cam">START CAMERA</button>
        <button class="ghost" id="rec">RECORD 4s</button>
        <button class="ghost" id="save" disabled>SAVE CLIP</button>
        <label class="btn ghost" for="file">OPEN CLIP</label>
        <input id="file" type="file" accept="video/*"/>
      </div>
      <div class="prompt" id="prompt">START CAMERA or OPEN CLIP from Files</div>
    </div>
  </div>
  <div class="mphwrap">
    <div class="mph" id="mph">—<span>MPH</span></div>
    <div class="sub" id="meta">Record the kick · then it reads the file</div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const live = $("live");
const cv = $("cv");
const ctx = cv.getContext("2d");
const BALL_M = 0.205;
const BALL_FT = 0.673;

let stream = null;
let recorder = null;
let chunks = [];
let lastBlob = null;
let recTimer = null;

function say(t){ $("prompt").textContent = t; }
function fit(){
  cv.width = innerWidth * devicePixelRatio;
  cv.height = innerHeight * devicePixelRatio;
}
addEventListener("resize", fit); fit();

function overlay(){
  const w=cv.width,h=cv.height;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle="#ff2ec8";
  ctx.lineWidth=4*devicePixelRatio;
  ctx.setLineDash([12*devicePixelRatio,8*devicePixelRatio]);
  ctx.beginPath();
  ctx.arc(w*0.72, h*0.70, w*0.045, 0, Math.PI*2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle="#ff2ec8";
  ctx.font=(12*devicePixelRatio)+"px sans-serif";
  ctx.fillText("TEE", w*0.72-14, h*0.70-w*0.045-8);
}
function loop(){ overlay(); requestAnimationFrame(loop); }

function mime(){
  const opts = [
    "video/mp4",
    "video/mp4;codecs=avc1",
    "video/webm;codecs=vp8",
    "video/webm"
  ];
  return opts.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
}

async function startCam(){
  stream = await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{ facingMode:"user", width:{ideal:1920}, height:{ideal:1080}, frameRate:{ideal:60} }
  });
  live.srcObject = stream;
  await live.play();
  $("cam").textContent="CAMERA ON";
  $("cam").className="go";
  say("Frame the ball in the pink tee · tap RECORD · then kick");
  loop();
}

function recName(){
  const d=new Date();
  const p=n=>String(n).padStart(2,"0");
  return "kicklab-"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
}

async function startRec(){
  if (!stream) await startCam();
  chunks = [];
  const type = mime();
  recorder = type ? new MediaRecorder(stream, { mimeType:type, videoBitsPerSecond:8_000_000 })
                  : new MediaRecorder(stream);
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = async () => {
    lastBlob = new Blob(chunks, { type: recorder.mimeType || "video/mp4" });
    $("save").disabled = false;
    $("rec").textContent = "RECORD 4s";
    $("rec").className = "ghost";
    say("Clip saved in memory · reading kick…");
    try { await analyzeBlob(lastBlob); }
    catch(err){ say("Could not read clip — SAVE it and OPEN CLIP"); console.error(err); }
  };
  recorder.start(200);
  $("rec").textContent = "RECORDING";
  $("rec").className = "rec";
  say("Recording 4 seconds — kick now");
  clearTimeout(recTimer);
  recTimer = setTimeout(() => { if (recorder && recorder.state==="recording") recorder.stop(); }, 4000);
}

$("cam").onclick = () => startCam().catch(() => say("Allow camera in Safari"));
$("rec").onclick = () => {
  if (recorder && recorder.state==="recording"){ recorder.stop(); return; }
  startRec().catch(() => say("Recording not allowed in this Safari"));
};
$("save").onclick = async () => {
  if (!lastBlob) return;
  const ext = (lastBlob.type||"").includes("webm") ? "webm" : "mp4";
  const file = new File([lastBlob], recName()+"."+ext, { type:lastBlob.type||"video/mp4" });
  if (navigator.canShare && navigator.canShare({ files:[file] })){
    try { await navigator.share({ files:[file], title:"Kicklab clip" }); say("Clip shared to Files / Photos"); return; } catch(e){}
  }
  const a=document.createElement("a");
  a.href=URL.createObjectURL(lastBlob);
  a.download=file.name;
  a.click();
  say("Save the clip from the share sheet");
};
$("file").onchange = async e => {
  const f=e.target.files && e.target.files[0];
  if (!f) return;
  lastBlob=f;
  $("save").disabled=false;
  say("Reading "+f.name+"…");
  try { await analyzeBlob(f); }
  catch(err){ say("Could not decode that file"); }
};

function isGrass(r,g,b){ return g>r+12 && g>b+8 && g>45; }
function isSkin(r,g,b){
  return r>80 && g>45 && r>b+8 && r-g<55 && g-b<45 && (r+g+b)/3<175;
}
function isBall(r,g,b){
  if (isGrass(r,g,b)||isSkin(r,g,b)) return false;
  const lum=(r+g+b)/3;
  if (lum>=160) return true;
  if (r>140 && r>g+24 && r>b+14) return true;
  return false;
}

function findBall(img){
  const {data,width:w,height:h}=img;
  let best=null,bestN=18;
  const step=4;
  for (let y=2;y<h-2;y+=step){
    for (let x=2;x<w-2;x+=step){
      const i=(y*w+x)*4;
      if (!isBall(data[i],data[i+1],data[i+2])) continue;
      let n=0,sx=0,sy=0,minx=w,maxx=0,miny=h,maxy=0;
      const R=14;
      for (let yy=y-R;yy<=y+R;yy+=2){
        if (yy<1||yy>=h-1) continue;
        for (let xx=x-R;xx<=x+R;xx+=2){
          if (xx<1||xx>=w-1) continue;
          const j=(yy*w+xx)*4;
          if (!isBall(data[j],data[j+1],data[j+2])) continue;
          n++; sx+=xx; sy+=yy;
          if (xx<minx)minx=xx; if(xx>maxx)maxx=xx;
          if (yy<miny)miny=yy; if(yy>maxy)maxy=yy;
        }
      }
      if (n<=bestN) continue;
      const dw=(maxx-minx), dh=(maxy-miny);
      const d=Math.max(dw,dh);
      if (d<8 || d>w*0.22) continue;
      const asp=dw>dh?dw/Math.max(dh,1):dh/Math.max(dw,1);
      if (asp>1.55) continue;
      bestN=n;
      best={x:sx/n,y:sy/n,d,n};
    }
  }
  return best;
}

function grab(video, w){
  const h=Math.round(w*video.videoHeight/video.videoWidth);
  const c=document.createElement("canvas");
  c.width=w; c.height=h;
  const g=c.getContext("2d");
  g.drawImage(video,0,0,w,h);
  return g.getImageData(0,0,w,h);
}

function waitSeek(video, t){
  return new Promise((res,rej)=>{
    const to=setTimeout(()=>rej(new Error("seek")), 1500);
    const on=()=>{ video.removeEventListener("seeked", on); clearTimeout(to); res(); };
    video.addEventListener("seeked", on);
    video.currentTime=Math.min(Math.max(0,t), Math.max(0, video.duration-0.001));
  });
}

async function analyzeBlob(blob){
  const url=URL.createObjectURL(blob);
  const v=document.createElement("video");
  v.muted=true; v.playsInline=true; v.preload="auto"; v.src=url;
  await new Promise((res,rej)=>{
    v.onloadedmetadata=res; v.onerror=()=>rej(new Error("meta"));
  });
  const dur=v.duration || 4;
  const fpsGuess = dur<=6 ? 30 : 24;
  const step=Math.max(1/60, 1/fpsGuess);
  const samples=[];
  say("Scanning "+dur.toFixed(1)+"s clip…");
  for (let t=0; t<dur-0.001; t+=step){
    try{ await waitSeek(v,t); } catch(e){ continue; }
    if (!v.videoWidth) continue;
    const img=grab(v, 640);
    const b=findBall(img);
    if (b) samples.push({t, x:b.x, y:b.y, d:b.d, w:img.width, h:img.height});
  }
  URL.revokeObjectURL(url);
  if (samples.length<3){
    say("No ball found in the clip — white/red size 4, side-on");
    return;
  }
  const ds=samples.map(s=>s.d).sort((a,b)=>a-b);
  const mid=ds[ds.length>>1];
  const mpp=BALL_M/mid;
  let kickI=0;
  let bestV=-1;
  for (let i=1;i<samples.length;i++){
    const dt=samples[i].t-samples[i-1].t;
    if (dt<=0||dt>0.2) continue;
    const dx=samples[i-1].x-samples[i].x;
    const vpx=dx/dt;
    if (dx>8 && vpx>bestV){ bestV=vpx; kickI=i-1; }
  }
  const win=samples.slice(kickI, Math.min(samples.length, kickI+8)).filter(s=>s.t-samples[kickI].t<=0.25);
  if (win.length<2){
    say("Saw the ball, not a kick — try a full strike across the frame");
    return;
  }
  const a=win[0], b=win[win.length-1];
  const dt=b.t-a.t;
  const distM=Math.hypot(b.x-a.x, b.y-a.y)*mpp;
  const mps=distM/dt;
  const mph=mps*2.23694;
  if (dt<0.04 || mph<6 || mph>70){
    say("Untrusted "+Math.round(mph)+" — clip needs the ball moving left across frame");
    return;
  }
  $("mph").innerHTML=Math.round(mph)+"<span>MPH</span>";
  $("meta").textContent=win.length+" hits · "+(dt*1000|0)+" ms · ball "+Math.round(mid)+"px";
  say(Math.round(mph)+" MPH · SAVE CLIP if you want the file");
}

</script>
</body>
</html>
