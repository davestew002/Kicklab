<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<title>KICKLAB LIVE</title>
<style>
  :root{--lime:#c8ff3d;--hot:#ff3df5;--red:#ff4d4d;--dim:#8b93a7;--txt:#f4f6fb}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#05070c;color:var(--txt);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  canvas{z-index:2}
  video{z-index:1;transform:scaleX(-1)}
  #hud{position:fixed;inset:0;z-index:3;pointer-events:none}
  #hud *{pointer-events:auto}
  .top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px}
  .brand{letter-spacing:.28em;font-size:11px;color:var(--lime);font-weight:700}
  .panel{background:rgba(8,10,16,.72);border:1px solid #2a3348;border-radius:16px;padding:12px;margin-top:8px;backdrop-filter:blur(10px)}
  label{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:8px 0 4px}
  select,button{width:100%;border:0;border-radius:12px;padding:12px;font:inherit}
  select{background:#0c0f16;color:var(--txt);border:1px solid #2a3348}
  button{font-weight:800;letter-spacing:.08em}
  .go{background:var(--lime);color:#111}
  .ghost{background:#0c0f16;color:var(--txt);border:1px solid #2a3348;margin-top:8px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mphwrap{position:absolute;left:12px;right:12px;bottom:calc(18px + env(safe-area-inset-bottom));text-align:center;pointer-events:none}
  .mph{font-size:92px;font-weight:800;letter-spacing:-.06em;line-height:.85;text-shadow:0 8px 30px #000}
  .mph span{font-size:18px;color:#c8ff3d;margin-left:8px}
  .arrow{font-size:120px;line-height:.7;opacity:.82;filter:drop-shadow(0 8px 18px #000)}
  .up{color:#7dff6a}
  .down{color:#ff4d4d}
  .same{color:#e6c35a}
  .sub{color:#d7dce8;font-size:15px;margin-top:4px}
  .step{font-size:13px;line-height:1.45;color:#d7dce8}
  .dot{display:inline-block;width:8px;height:8px;border-radius:99px;background:var(--lime);margin-right:6px}
</style>
</head>
<body>
<div id="stage">
  <video id="vid" playsinline muted autoplay></video>
  <canvas id="cv"></canvas>
</div>
<div id="hud">
  <div class="top">
    <div class="brand">KICKLAB LIVE</div>
    <div class="panel" id="cal">
      <div class="step" id="copy">1. Tripod in front of the player. Selfie camera. Phone level.<br>2. Drag the 2-FT ring onto the ball spot.<br>3. Gate on the right is 8 FT at the same depth.</div>
      <label>Ball</label>
      <select id="ball">
        <option value="white">White ball</option>
        <option value="lime">Neon / lime ball</option>
      </select>
      <label>Size</label>
      <select id="size">
        <option value="0.205" selected>Size 4 — 20.5 cm</option>
        <option value="0.191">Size 3</option>
        <option value="0.220">Size 5</option>
      </select>
      <div class="row">
        <button class="ghost" id="cam">START CAMERA</button>
        <button class="go" id="lock">LOCK CALIBRATION</button>
      </div>
    </div>
  </div>
  <div class="mphwrap" id="readout" style="display:none">
    <div class="arrow same" id="arrow">→</div>
    <div class="mph" id="mph">—<span>MPH</span></div>
    <div class="sub" id="meta">Waiting for a ball through the 8-FT gate</div>
  </div>
</div>
<script>
const vid=$("vid"), cv=$("cv"), ctx=cv.getContext("2d",{willReadFrequently:true});
function $(id){return document.getElementById(id)}
const state={
  live:false, locked:false,
  cx:0.32, cy:0.62, r:0.09,
  drag:null, lastMph:null,
  prev:null, lastT:0,
  hits:[],
  ring:"lime"
};
function ringColor(){
  state.ring="hot";
  return "#ff2ec8";
}
function resize(){
  cv.width=innerWidth*devicePixelRatio;
  cv.height=innerHeight*devicePixelRatio;
}
addEventListener("resize", resize); resize();

async function startCam(){
  const stream=await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{ facingMode:"user", width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:60} }
  });
  vid.srcObject=stream;
  await vid.play();
  state.live=true;
  loop();
}

function gateBox(){
  // 2-ft ring diameter in normalized x. 8 ft = 4 ring-diameters to the right of center.
  const d=state.r*2;
  const gx=state.cx + 4*d;
  const gy=state.cy;
  return {x:gx, y:gy, w:d*0.55, h:d*1.35};
}

function toNorm(ev){
  const r=cv.getBoundingClientRect();
  return {x:(ev.clientX-r.left)/r.width, y:(ev.clientY-r.top)/r.height};
}
cv.addEventListener("pointerdown", ev=>{
  if(state.locked) return;
  const p=toNorm(ev);
  const dx=p.x-state.cx, dy=p.y-state.cy;
  if(Math.hypot(dx,dy)<state.r*1.4) state.drag="move";
  else if(Math.abs(Math.hypot(dx,dy)-state.r)<0.04) state.drag="size";
  else state.drag="move";
  state.px=p.x; state.py=p.y;
});
cv.addEventListener("pointermove", ev=>{
  if(!state.drag||state.locked) return;
  const p=toNorm(ev);
  if(state.drag==="move"){ state.cx+=p.x-state.px; state.cy+=p.y-state.py; }
  if(state.drag==="size"){ state.r=Math.min(0.2, Math.max(0.04, Math.hypot(p.x-state.cx,p.y-state.cy))); }
  state.px=p.x; state.py=p.y;
});
addEventListener("pointerup", ()=> state.drag=null);

function isTarget(r,g,b){
  if($("ball").value==="white") return r>165&&g>155&&b>140&&Math.abs(r-g)<45;
  return (g>115&&r>55&&b<155&&(g+r)>200&&g>b+12);
}

function findBall(img){
  const w=img.width,h=img.height,data=img.data;
  const x0=Math.floor(w*0.05), x1=Math.floor(w*0.95);
  const y0=Math.floor(h*0.15), y1=Math.floor(h*0.88);
  let sx=0,sy=0,n=0,minx=w,maxx=0,miny=h,maxy=0;
  for(let y=y0;y<y1;y+=2){
    for(let x=x0;x<x1;x+=2){
      const i=(y*w+x)*4;
      if(isTarget(data[i],data[i+1],data[i+2])){
        sx+=x;sy+=y;n++;
        if(x<minx)minx=x; if(x>maxx)maxx=x;
        if(y<miny)miny=y; if(y>maxy)maxy=y;
      }
    }
  }
  if(n<12) return null;
  const d=Math.max(maxx-minx,maxy-miny);
  if(d<6||d>90) return null;
  return {x:sx/n/w, y:sy/n/h, d:d/w};
}

function inGate(p,g){
  return p.x>g.x-g.w && p.x<g.x+g.w && p.y>g.y-g.h && p.y<g.y+g.h;
}
function inRing(p){
  return Math.hypot(p.x-state.cx,p.y-state.cy) < state.r*1.25;
}

function draw(hit, gateHot){
  const w=cv.width,h=cv.height;
  ctx.clearRect(0,0,w,h);
  const col=ringColor();
  // 2-ft ring
  ctx.beginPath();
  ctx.strokeStyle=col;
  ctx.lineWidth=4*devicePixelRatio;
  ctx.setLineDash([14*devicePixelRatio,10*devicePixelRatio]);
  ctx.arc(state.cx*w, state.cy*h, state.r*w, 0, Math.PI*2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=col;
  ctx.font=(13*devicePixelRatio)+"px sans-serif";
  ctx.fillText("2 FT  BALL SPOT", state.cx*w-50, state.cy*h-state.r*w-12);
  // 8-ft gate
  const g=gateBox();
  ctx.strokeStyle=gateHot? "#7dff6a" : col;
  ctx.globalAlpha=gateHot?0.95:0.75;
  ctx.lineWidth=(gateHot?7:4)*devicePixelRatio;
  ctx.strokeRect((g.x-g.w)*w,(g.y-g.h)*h, g.w*2*w, g.h*2*h);
  ctx.globalAlpha=1;
  ctx.fillText("8 FT GATE", (g.x-g.w)*w, (g.y-g.h)*h-10);
  if(hit){
    ctx.beginPath();
    ctx.strokeStyle="#fff";
    ctx.lineWidth=3*devicePixelRatio;
    ctx.arc(hit.x*w, hit.y*h, Math.max(8, hit.d*w/2), 0, Math.PI*2);
    ctx.stroke();
  }
}

function flash(mph){
  $("readout").style.display="block";
  $("mph").innerHTML=mph.toFixed(0)+"<span>MPH</span>";
  const prev=state.lastMph;
  const el=$("arrow");
  if(prev==null){ el.textContent="→"; el.className="arrow same"; }
  else if(mph>prev+0.7){ el.textContent="↑"; el.className="arrow up"; }
  else if(mph<prev-0.7){ el.textContent="↓"; el.className="arrow down"; }
  else { el.textContent="→"; el.className="arrow same"; }
  $("meta").textContent = prev==null ? "FIRST KICK" : (mph>prev? "FASTER" : mph<prev? "SLOWER" : "SAME");
  state.lastMph=mph;
}

function loop(){
  if(!state.live) return;
  const vw=vid.videoWidth, vh=vid.videoHeight;
  if(vw){
    const tw=480, th=Math.round(480*vh/vw);
    const off=document.createElement("canvas");
    off.width=tw; off.height=th;
    const o=off.getContext("2d",{willReadFrequently:true});
    o.save(); o.translate(tw,0); o.scale(-1,1);
    o.drawImage(vid,0,0,tw,th);
    o.restore();
    const img=o.getImageData(0,0,tw,th);
    const hit=state.locked? findBall(img): null;
    const g=gateBox();
    const hot=hit && inGate(hit,g);
    draw(hit, hot);

    if(state.locked && hit){
      const t=performance.now()/1000;
      if(inRing(hit)) state.t0=t;
      if(hot && state.t0 && t-state.t0>0.04 && t-state.t0<1.2){
        const dt=t-state.t0;
        const feet=8;
        const fps=feet/dt;
        const mph=fps*0.681818;
        if(mph>=8 && mph<=80){
          flash(mph);
          state.t0=null;
        }
      }
    }
  } else draw(null,false);
  requestAnimationFrame(loop);
}

$("cam").onclick=()=>startCam().catch(e=>alert("Allow camera. Use HTTPS / GitHub Pages."));
$("lock").onclick=()=>{
  if(!state.live){ startCam().then(()=>{state.locked=true; $("cal").style.opacity=.35; $("readout").style.display="block";}); return; }
  state.locked=true;
  $("cal").style.opacity=.28;
  $("readout").style.display="block";
};
$("ball").onchange=ringColor;
</script>
</body>
</html>
