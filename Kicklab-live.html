<!DOCTYPE html>
<!--
KICKLAB LIVE v72 — white start line only.
ARM = READY. After READY, first fast leftward object across the line scores.
Drag never scores. No green tracker. No second line.
Scale = size-4 diameter (0.673 ft), or a default if the ball was not measured.
-->
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<title>KICKLAB LIVE</title>
<style>
  :root{--lime:#c8ff3d;--line:#ffffff;--txt:#f4f6fb}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#05070c;color:var(--txt);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}
  #stage{position:fixed;inset:0}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  video{z-index:1;transform:scaleX(-1)}
  canvas{z-index:2}
  #hud{position:fixed;inset:0;z-index:3;pointer-events:none}
  #hud *{pointer-events:auto}
  .top{position:absolute;top:calc(6px + env(safe-area-inset-top));left:10px;right:10px}
  .brand{letter-spacing:.28em;font-size:10px;color:var(--lime);font-weight:700}
  .panel{background:rgba(8,10,16,.82);border:1px solid #2a3348;border-radius:14px;padding:8px 10px;margin-top:6px;backdrop-filter:blur(10px);max-width:72vw}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
  button{border:0;border-radius:10px;padding:8px 10px;font:inherit;font-weight:800}
  .go{background:var(--lime);color:#111}
  .ghost{background:#0c0f16;color:var(--txt);border:1px solid #2a3348}
  .prompt{margin-top:6px;font-size:15px;font-weight:800;color:var(--lime)}
  .mphwrap{position:absolute;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom));text-align:center;pointer-events:none}
  .mph{font-size:28vh;font-weight:800;letter-spacing:-.06em;line-height:.82;text-shadow:0 10px 40px #000}
  .mph span{font-size:5vh;color:var(--lime);margin-left:10px}
  .arrow{font-size:12vh;line-height:.7}
  .up{color:#7dff6a}.down{color:#ff4d4d}.same{color:#e6c35a}
  .sub{color:#d7dce8;font-size:13px}
</style>
</head>
<body>
<div id="stage">
  <video id="vid" playsinline muted autoplay></video>
  <canvas id="cv"></canvas>
</div>
<div id="hud">
  <div class="top">
    <div class="brand">KICKLAB LIVE</div>
    <div class="panel">
      <div class="row">
        <button class="ghost" id="cam">START CAMERA</button>
        <button class="ghost" id="arm">ARM LINE</button>
        <button class="ghost" id="unlock">RESET</button>
      </div>
      <div class="prompt" id="prompt">START CAMERA · drag the white line · tap ARM LINE</div>
    </div>
  </div>
  <div class="mphwrap">
    <div class="arrow same" id="arrow">→</div>
    <div class="mph" id="mph">—<span>MPH</span></div>
    <div class="sub" id="meta">Size 4 · line trap</div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const vid = $("vid"), cv = $("cv");
const ctx = cv.getContext("2d", { willReadFrequently:true });
const buf = document.createElement("canvas");
const btx = buf.getContext("2d", { willReadFrequently:true });
const AW = 420;
const BALL_FT = 0.673;
const DEFAULT_D = 0.055;

const S = {
  live:false, phase:"off",
  gx:0.55, gy0:0.50, gy1:0.90,
  drag:false, quiet:0,
  cool:0,
  path:[],
  scaleD:DEFAULT_D,
  lastMph:null,
  prev:null
};

function say(t){ $("prompt").textContent = t; }
function clearMph(){
  $("mph").innerHTML = "—<span>MPH</span>";
  $("arrow").textContent = "→";
  $("arrow").className = "arrow same";
}
function frozen(){
  return S.drag || performance.now() < S.quiet;
}
function fit(){
  cv.width = innerWidth * devicePixelRatio;
  cv.height = innerHeight * devicePixelRatio;
}
addEventListener("resize", fit); fit();

function drawCover(c,w,h){
  const vw=vid.videoWidth, vh=vid.videoHeight;
  if(!vw) return;
  const s=Math.max(w/vw,h/vh);
  const dw=vw*s, dh=vh*s;
  c.save(); c.translate(w,0); c.scale(-1,1);
  c.drawImage(vid,(w-dw)/2,(h-dh)/2,dw,dh);
  c.restore();
}
function snap(){
  const th=Math.max(180, Math.round(AW*cv.height/cv.width));
  if(buf.width!==AW||buf.height!==th){ buf.width=AW; buf.height=th; }
  drawCover(btx,AW,th);
  return btx.getImageData(0,0,AW,th);
}

function lum(r,g,b){ return (r+g+b)/3; }
function isGrass(r,g,b){ return g>r+14 && g>b+10 && g>50; }
function isSkin(r,g,b){
  return r>95 && g>50 && r>b+12 && r-g<70 && lum(r,g,b)<180;
}

function motionHit(prev, curr){
  if(!prev || prev.width!==curr.width) return null;
  const w=curr.width, h=curr.height;
  const xa=Math.max(1, ((S.gx-0.16)*w)|0);
  const xb=Math.min(w-2, ((S.gx+0.10)*w)|0);
  const ya=Math.max(1, ((S.gy0-0.04)*h)|0);
  const yb=Math.min(h-2, ((S.gy1+0.02)*h)|0);
  let sx=0,sy=0,n=0,minx=w,maxx=0,miny=h,maxy=0;
  const step=2;
  for(let y=ya;y<yb;y+=step){
    for(let x=xa;x<xb;x+=step){
      const i=(y*w+x)*4;
      const r=curr.data[i], g=curr.data[i+1], b=curr.data[i+2];
      if(isGrass(r,g,b) || isSkin(r,g,b)) continue;
      const d = Math.abs(lum(r,g,b) - lum(prev.data[i],prev.data[i+1],prev.data[i+2]));
      if(d<28) continue;
      n++; sx+=x; sy+=y;
      if(x<minx)minx=x; if(x>maxx)maxx=x;
      if(y<miny)miny=y; if(y>maxy)maxy=y;
    }
  }
  if(n<10) return null;
  const dw=(maxx-minx)/w, dh=(maxy-miny)/h;
  if(dh>0.28) return null;
  if(dw>0.22) return null;
  const asp = dh/Math.max(dw,0.001);
  if(asp>2.1) return null;
  return {x:(sx/n)/w, y:(sy/n)/h, d:Math.max(dw,dh,0.03), n};
}

function publish(mph){
  mph=Math.round(mph);
  $("mph").innerHTML=mph+"<span>MPH</span>";
  const el=$("arrow");
  if(S.lastMph==null){ el.textContent="→"; el.className="arrow same"; }
  else if(mph>S.lastMph+1){ el.textContent="↑"; el.className="arrow up"; }
  else if(mph<S.lastMph-1){ el.textContent="↓"; el.className="arrow down"; }
  else { el.textContent="→"; el.className="arrow same"; }
  S.lastMph=mph;
  $("meta").textContent="Size 4 · line trap";
  say(mph+" MPH · tap ARM LINE for the next kick");
  S.phase="done";
  S.cool=performance.now()+2200;
  S.path=[];
  $("arm").className="ghost";
}

function scorePath(){
  if(frozen()) return false;
  const p=S.path;
  if(p.length<2) return false;
  const a=p[0], b=p[p.length-1];
  const dt=b.t-a.t;
  if(dt<0.05 || dt>0.40) return false;
  const left=a.x-b.x;
  if(left<0.04) return false;
  if(b.x>S.gx+0.06) return false;
  const aspect=innerHeight/innerWidth;
  const fpp=BALL_FT/Math.max(S.scaleD||DEFAULT_D,0.025);
  const dist=Math.hypot(left,(b.y-a.y)*aspect)*fpp;
  if(dist<1.0) return false;
  const mph=(dist/dt)*0.681818;
  if(mph<14 || mph>62) return false;
  publish(mph);
  return true;
}

function draw(){
  const w=cv.width,h=cv.height;
  ctx.clearRect(0,0,w,h);
  const x=S.gx*w;
  const y0=S.gy0*h, y1=S.gy1*h;
  const ready = S.phase==="armed" || S.phase==="fly";
  const cooling = S.phase==="done";
  ctx.strokeStyle="#ffffff";
  ctx.fillStyle="#ffffff";
  ctx.globalAlpha = cooling ? 0.16 : (ready ? 1 : 0.45);
  ctx.lineWidth=(ready?10:6)*devicePixelRatio;
  ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(x,y0);
  ctx.lineTo(x,y1);
  ctx.stroke();
  ctx.globalAlpha=1;
  ctx.font=(14*devicePixelRatio)+"px sans-serif";
  ctx.fillText(ready?"READY":(cooling?"HOLD":"LINE"), x+14, y0-8);
}

function arm(){
  if(!S.live){ startCam(); return; }
  if(frozen()) return;
  S.phase="armed";
  S.path=[];
  S.prev=null;
  $("arm").className="go";
  say("READY TO KICK");
}

function reset(){
  S.phase=S.live?"seek":"off";
  S.path=[]; S.prev=null;
  $("arm").className="ghost";
  clearMph();
  say(S.live?"Drag the white line · tap ARM LINE":"START CAMERA");
}

function loop(){
  if(!S.live) return;
  requestAnimationFrame(loop);
  if(!vid.videoWidth) return;
  const img=snap();
  const t=performance.now()/1000;
  draw();

  if(frozen()){ S.prev=img; return; }

  if(S.phase==="done"){
    if(performance.now()>S.cool) say(S.lastMph? (S.lastMph+" MPH · tap ARM LINE for the next kick") : "Tap ARM LINE");
    S.prev=img; return;
  }

  if(S.phase!=="armed" && S.phase!=="fly"){
    S.prev=img; return;
  }

  const hit=motionHit(S.prev, img);
  S.prev=img;
  if(!hit) return;

  if(!S.path.length){
    S.path.push({t,x:hit.x,y:hit.y});
    S.phase="fly";
    say("READING");
    return;
  }
  const last=S.path[S.path.length-1];
  if(Math.hypot(hit.x-last.x,hit.y-last.y)<0.008) return;
  S.path.push({t,x:hit.x,y:hit.y});
  if(S.path.length>8) S.path.shift();
  if(scorePath()) return;
  if(t-S.path[0].t>0.45){
    S.path=[];
    S.phase="armed";
    say("READY TO KICK");
  }
}

function startCam(){
  if(S.live) return;
  navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{ facingMode:"user", width:{ideal:1280}, height:{ideal:720} }
  }).then(s=>{ vid.srcObject=s; return vid.play(); })
    .then(()=>{
      S.live=true; S.phase="seek";
      $("cam").textContent="CAMERA ON"; $("cam").className="go";
      say("Drag the white line · tap ARM LINE when the ball is set");
      loop();
    }).catch(()=>say("Allow camera in Safari"));
}

$("cam").onclick=startCam;
$("unlock").onclick=reset;
$("arm").onclick=arm;

function pt(e){ const t=e.touches?e.touches[0]:e; return {x:t.clientX/innerWidth,y:t.clientY/innerHeight}; }
cv.addEventListener("pointerdown", e=>{
  const p=pt(e);
  if(Math.abs(p.x-S.gx)<0.10 && p.y>S.gy0-0.10 && p.y<S.gy1+0.10){
    S.drag="line";
    S.quiet=performance.now()+1500;
    S.path=[];
    if(S.phase==="fly") S.phase="seek";
    try{cv.setPointerCapture(e.pointerId)}catch(_){}
  }
});
addEventListener("pointermove", e=>{
  if(S.drag!=="line") return;
  const p=pt(e);
  S.gx=Math.min(0.78,Math.max(0.18,p.x));
  S.quiet=performance.now()+1500;
});
addEventListener("pointerup", ()=>{
  if(S.drag){
    S.quiet=performance.now()+1500;
    S.path=[];
    if(S.phase==="fly" || S.phase==="armed") S.phase="seek";
    $("arm").className="ghost";
    say("Line moved · tap ARM LINE when ready");
  }
  S.drag=false;
});
</script>
</body>
</html>
