<!DOCTYPE html>
<!--
KICKLAB LIVE — speed trap
White stripe on the grass = start line.
Scale = size-4 ball diameter only (0.205 m / 0.673 ft).
Speed = ball center motion in the frames around the line. Not the foot. Not the fence.
Front camera, Safari, landscape. No upload. No recorder.
-->
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<title>KICKLAB LIVE</title>
<style>
  :root{--lime:#c8ff3d;--line:#f4f6fb;--txt:#f4f6fb}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#05070c;color:var(--txt);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}
  #stage{position:fixed;inset:0}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  video{z-index:1;transform:scaleX(-1)}
  canvas{z-index:2}
  #hud{position:fixed;inset:0;z-index:3;pointer-events:none}
  #hud *{pointer-events:auto}
  .top{position:absolute;top:calc(6px + env(safe-area-inset-top));left:10px;right:10px}
  .brand{letter-spacing:.28em;font-size:10px;color:var(--lime);font-weight:700}
  .panel{background:rgba(8,10,16,.82);border:1px solid #2a3348;border-radius:14px;padding:8px 10px;margin-top:6px;backdrop-filter:blur(10px);max-width:72vw}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
  button{border:0;border-radius:10px;padding:8px 10px;font:inherit;font-weight:800}
  .go{background:var(--lime);color:#111}
  .ghost{background:#0c0f16;color:var(--txt);border:1px solid #2a3348}
  .prompt{margin-top:6px;font-size:15px;font-weight:800;color:var(--lime)}
  .mphwrap{position:absolute;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom));text-align:center;pointer-events:none}
  .mph{font-size:28vh;font-weight:800;letter-spacing:-.06em;line-height:.82;text-shadow:0 10px 40px #000}
  .mph span{font-size:5vh;color:var(--lime);margin-left:10px}
  .arrow{font-size:12vh;line-height:.7}
  .up{color:#7dff6a}.down{color:#ff4d4d}.same{color:#e6c35a}
  .sub{color:#d7dce8;font-size:13px}
</style>
</head>
<body>
<div id="stage">
  <video id="vid" playsinline muted autoplay></video>
  <canvas id="cv"></canvas>
</div>
<div id="hud">
  <div class="top">
    <div class="brand">KICKLAB LIVE</div>
    <div class="panel">
      <div class="row">
        <button class="ghost" id="cam">START CAMERA</button>
        <button class="ghost" id="arm">ARM LINE</button>
        <button class="ghost" id="unlock">RESET</button>
      </div>
      <div class="prompt" id="prompt">START CAMERA · drag the white line to the start spot</div>
    </div>
  </div>
  <div class="mphwrap">
    <div class="arrow same" id="arrow">→</div>
    <div class="mph" id="mph">—<span>MPH</span></div>
    <div class="sub" id="meta">Size 4 · line trap</div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const vid = $("vid"), cv = $("cv");
const ctx = cv.getContext("2d", { willReadFrequently:true });
const buf = document.createElement("canvas");
const btx = buf.getContext("2d", { willReadFrequently:true });
const AW = 420;
const BALL_FT = 0.673;
const LINE = "#f4f6fb";

const S = {
  live:false, phase:"off",
  gx:0.42, gy0:0.52, gy1:0.88,
  drag:false, quiet:0,
  still:0,
  cool:0,
  last:null,
  path:[],
  scaleD:null,
  lastMph:null
};

function say(t){ $("prompt").textContent = t; }
function clearMph(){
  $("mph").innerHTML = "—<span>MPH</span>";
  $("arrow").textContent = "→";
  $("arrow").className = "arrow same";
}
function fit(){
  cv.width = innerWidth * devicePixelRatio;
  cv.height = innerHeight * devicePixelRatio;
}
addEventListener("resize", fit); fit();

function drawCover(c,w,h){
  const vw=vid.videoWidth, vh=vid.videoHeight;
  if(!vw) return;
  const s=Math.max(w/vw,h/vh);
  const dw=vw*s, dh=vh*s;
  c.save(); c.translate(w,0); c.scale(-1,1);
  c.drawImage(vid,(w-dw)/2,(h-dh)/2,dw,dh);
  c.restore();
}
function snap(){
  const th=Math.max(180, Math.round(AW*cv.height/cv.width));
  if(buf.width!==AW||buf.height!==th){ buf.width=AW; buf.height=th; }
  drawCover(btx,AW,th);
  return btx.getImageData(0,0,AW,th);
}

function isGrass(r,g,b){ return g>r+12 && g>b+8 && g>45; }
function isSkin(r,g,b){
  return r>90 && g>55 && r>b+8 && Math.abs(r-g)<55 && (r+g+b)/3<175;
}
function isBallSeed(r,g,b){
  if(isGrass(r,g,b) || isSkin(r,g,b)) return false;
  const lum=(r+g+b)/3;
  if(lum>130) return true;
  if(r>128 && r>g+18 && r>b+10) return true;
  return false;
}
function isBallFill(r,g,b){
  if(isGrass(r,g,b) || isSkin(r,g,b)) return false;
  if(isBallSeed(r,g,b)) return true;
  const lum=(r+g+b)/3;
  return lum<88 && Math.abs(r-g)<32 && Math.abs(g-b)<32;
}

function blobAt(img, x0,x1,y0,y1){
  const {data,width:w,height:h}=img;
  const xa=Math.max(1,(x0*w)|0), xb=Math.min(w-1,(x1*w)|0);
  const ya=Math.max(1,(y0*h)|0), yb=Math.min(h-1,(y1*h)|0);
  let best=null, bestN=7;
  const step=3;
  for(let y=ya;y<yb;y+=step){
    for(let x=xa;x<xb;x+=step){
      const i=(y*w+x)*4;
      if(!isBallSeed(data[i],data[i+1],data[i+2])) continue;
      let n=0, bright=0, sx=0,sy=0,minx=w,maxx=0,miny=h,maxy=0;
      const R=12;
      for(let yy=y-R;yy<=y+R;yy+=2){
        if(yy<1||yy>=h-1) continue;
        for(let xx=x-R;xx<=x+R;xx+=2){
          if(xx<1||xx>=w-1) continue;
          const j=(yy*w+xx)*4;
          const r=data[j],g=data[j+1],b=data[j+2];
          if(!isBallFill(r,g,b)) continue;
          n++; sx+=xx; sy+=yy;
          if(isBallSeed(r,g,b)) bright++;
          if(xx<minx)minx=xx; if(xx>maxx)maxx=xx;
          if(yy<miny)miny=yy; if(yy>maxy)maxy=yy;
        }
      }
      if(n<=bestN || bright<4) continue;
      const dw=(maxx-minx)/w, dh=(maxy-miny)/h;
      const d=Math.max(dw,dh);
      if(d<0.018||d>0.12) continue;
      const asp=dw>dh?dw/Math.max(dh,.001):dh/Math.max(dw,.001);
      if(asp>1.45) continue;
      bestN=n;
      best={n,bright,x:sx/n/w,y:sy/n/h,d};
    }
  }
  return best;
}

function nearLine(img){
  return blobAt(img, S.gx-0.07, S.gx+0.07, S.gy0-0.04, S.gy1+0.04);
}
function rightOfLine(img){
  return blobAt(img, S.gx+0.03, Math.min(0.92,S.gx+0.28), S.gy0-0.06, S.gy1+0.04);
}

function publish(mph, height){
  mph=Math.round(mph);
  $("mph").innerHTML=mph+"<span>MPH</span>";
  const el=$("arrow");
  if(S.lastMph==null){ el.textContent="→"; el.className="arrow same"; }
  else if(mph>S.lastMph+1){ el.textContent="↑"; el.className="arrow up"; }
  else if(mph<S.lastMph-1){ el.textContent="↓"; el.className="arrow down"; }
  else { el.textContent="→"; el.className="arrow same"; }
  S.lastMph=mph;
  $("meta").textContent="Size 4 · "+height+" · line trap";
  say(mph+" MPH · "+height+" · place next ball");
  S.phase="done";
  S.cool=performance.now()+1600;
  S.path=[];
  S.last=null;
}

function heightBand(y){
  const mid=(S.gy0+S.gy1)/2;
  const span=Math.max(0.08, S.gy1-S.gy0);
  if(y<mid-span*0.18) return "HIGH";
  if(y>mid+span*0.18) return "LOW";
  return "MID";
}

function score(){
  const p=S.path.filter(a=>a && a.x!=null);
  if(p.length<2 || !S.scaleD) return false;
  const a=p[0], b=p[p.length-1];
  const dt=b.t-a.t;
  if(dt<0.06 || dt>0.55) return false;
  const leftward=a.x-b.x;
  if(leftward<0.035) return false;
  const aspect=innerHeight/innerWidth;
  const fpp=BALL_FT/Math.max(S.scaleD,0.018);
  const dist=Math.hypot(b.x-a.x,(b.y-a.y)*aspect)*fpp;
  if(dist<0.9) return false;
  const mph=(dist/dt)*0.681818;
  if(mph<10 || mph>62) return false;
  publish(mph, heightBand(b.y));
  return true;
}

function draw(hit){
  const w=cv.width,h=cv.height;
  ctx.clearRect(0,0,w,h);
  const x=S.gx*w;
  const y0=S.gy0*h, y1=S.gy1*h;
  const ready = S.phase==="armed";
  const crossing = S.phase==="fly";
  const cooling = S.phase==="done";
  ctx.strokeStyle = ready || crossing ? "#c8ff3d" : LINE;
  ctx.fillStyle=ctx.strokeStyle;
  ctx.globalAlpha = cooling ? 0.18 : (ready || crossing ? 1 : 0.55);
  ctx.lineWidth=8*devicePixelRatio;
  ctx.beginPath();
  ctx.moveTo(x,y0);
  ctx.lineTo(x,y1);
  ctx.stroke();
  ctx.globalAlpha = cooling ? 0.06 : 0.20;
  ctx.lineWidth=22*devicePixelRatio;
  ctx.beginPath();
  ctx.moveTo(x,y0);
  ctx.lineTo(x,y1);
  ctx.stroke();
  ctx.globalAlpha=1;
  ctx.font=(13*devicePixelRatio)+"px sans-serif";
  ctx.fillText(ready?"READY":(cooling?"HOLD":"START"), x+12, y0-10);
  if(hit){
    ctx.strokeStyle="#7dff6a";
    ctx.lineWidth=4*devicePixelRatio;
    ctx.beginPath();
    ctx.arc(hit.x*w,hit.y*h,Math.max(8,(hit.d||0.03)*w*0.5),0,Math.PI*2);
    ctx.stroke();
  }
}

function loop(){
  if(!S.live) return;
  if(!vid.videoWidth){ requestAnimationFrame(loop); return; }
  const img=snap();
  const t=performance.now()/1000;
  const quiet=S.drag || performance.now()<S.quiet;
  const onLine=nearLine(img);
  const waiting=rightOfLine(img);
  const hit=onLine||waiting;

  if(quiet){ draw(hit); requestAnimationFrame(loop); return; }

  if(S.phase==="done"){
    if(performance.now()>S.cool && waiting){
      S.phase="armed";
      S.path=[]; S.last=waiting; S.last.t=t;
      if(waiting.d) S.scaleD=waiting.d;
      say("READY TO KICK");
    }
    draw(hit); requestAnimationFrame(loop); return;
  }

  if(S.phase==="armed" || S.phase==="fly"){
    if(waiting && !onLine){
      S.last=waiting; S.last.t=t;
      if(waiting.d) S.scaleD=waiting.d;
      S.phase="armed";
      say("READY TO KICK");
    }
    if(onLine){
      S.phase="fly";
      if(S.last) S.path.push({t:S.last.t,x:S.last.x,y:S.last.y,d:S.last.d});
      S.path.push({t,x:onLine.x,y:onLine.y,d:onLine.d});
      if(onLine.d) S.scaleD=S.scaleD||onLine.d;
      say("CROSSING");
      if(score()){ draw(onLine); requestAnimationFrame(loop); return; }
    } else if(S.phase==="fly"){
      const air=blobAt(img, Math.max(0.04,S.gx-0.22), S.gx+0.02, S.gy0-0.10, S.gy1+0.06);
      if(air) S.path.push({t,x:air.x,y:air.y,d:air.d});
      if(score()){ draw(air); requestAnimationFrame(loop); return; }
      if(S.path.length && t-S.path[0].t>0.55){
        say("Missed the line — reset the ball");
        S.phase="done";
        S.cool=performance.now()+800;
      }
    }
    draw(hit);
    requestAnimationFrame(loop); return;
  }

  if(S.phase==="seek"){
    if(waiting){
      S.still=(S.still||0)+1;
      if(waiting.d) S.scaleD=waiting.d;
      if(S.still>=4){
        S.phase="armed"; S.last=waiting; S.last.t=t;
        $("arm").className="go";
        say("READY TO KICK");
      } else say("Ball right of the line — hold still");
    } else {
      S.still=0;
      say("Place the ball just right of the line");
    }
    draw(hit);
  }
  requestAnimationFrame(loop);
}

function startCam(){
  if(S.live) return;
  navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{ facingMode:"user", width:{ideal:1280}, height:{ideal:720} }
  }).then(s=>{ vid.srcObject=s; return vid.play(); })
    .then(()=>{
      S.live=true; S.phase="seek";
      $("cam").textContent="CAMERA ON"; $("cam").className="go";
      say("Drag the white line to the start spot · ball on the right");
      loop();
    }).catch(()=>say("Allow camera in Safari"));
}

function reset(){
  S.phase=S.live?"seek":"off";
  S.still=0; S.path=[]; S.last=null; S.scaleD=null;
  $("arm").className="ghost";
  clearMph();
  say(S.live?"Place the ball just right of the line":"START CAMERA");
}

$("cam").onclick=startCam;
$("unlock").onclick=reset;
$("arm").onclick=()=>{
  if(!S.live){ startCam(); return; }
  const waiting=rightOfLine(snap());
  if(!waiting){ say("No ball right of the line"); return; }
  S.phase="armed";
  S.last=waiting; S.last.t=performance.now()/1000;
  S.scaleD=waiting.d;
  S.path=[];
  $("arm").className="go";
  clearMph();
  say("READY TO KICK");
};

function pt(e){ const t=e.touches?e.touches[0]:e; return {x:t.clientX/innerWidth,y:t.clientY/innerHeight}; }
cv.addEventListener("pointerdown", e=>{
  const p=pt(e);
  if(Math.abs(p.x-S.gx)<0.08 && p.y>S.gy0-0.08 && p.y<S.gy1+0.08){
    S.drag="line"; S.quiet=performance.now()+500;
    try{cv.setPointerCapture(e.pointerId)}catch(_){}
  }
});
addEventListener("pointermove", e=>{
  if(S.drag!=="line") return;
  const p=pt(e);
  S.gx=Math.min(0.70,Math.max(0.18,p.x));
});
addEventListener("pointerup", ()=>{
  if(S.drag) S.quiet=performance.now()+400;
  S.drag=false;
});
</script>
</body>
</html>
