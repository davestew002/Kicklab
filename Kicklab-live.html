<!DOCTYPE html>
<!--
KICKLAB LIVE v75
White vertical start stripe only (no horizontal bar).
Bottom-right quarter = READY. Bottom-left quarter = MPH.
Ball-scale speed trap. Ignore < 8 mph. Auto-rearm.
-->
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<title>KICKLAB LIVE</title>
<style>
  :root{--lime:#c8ff3d;--txt:#f7f8fb}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#07090e;color:var(--txt);font-family:-apple-system,system-ui,sans-serif;overflow:hidden;touch-action:none}
  #stage{position:fixed;inset:0}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  video{z-index:1;transform:scaleX(-1)}
  canvas{z-index:2}
  #hud{position:fixed;inset:0;z-index:3;pointer-events:none}
  #hud *{pointer-events:auto}
  .top{position:absolute;top:calc(8px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .brand{letter-spacing:.32em;font-size:11px;font-weight:800;color:var(--lime)}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  button{border:0;border-radius:999px;padding:8px 12px;font:inherit;font-weight:800;font-size:12px}
  .go{background:var(--lime);color:#111}
  .ghost{background:rgba(10,12,18,.72);color:#fff;border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px)}
  .status{position:absolute;right:2vw;bottom:2vh;width:46vw;height:23vh;display:flex;align-items:flex-end;justify-content:flex-end;pointer-events:none;text-align:right}
  .status b{font-size:9vh;line-height:.85;letter-spacing:.04em;font-weight:800;color:#fff;text-shadow:0 10px 28px rgba(0,0,0,.55)}
  .status span{display:block;font-size:2.2vh;letter-spacing:.18em;color:var(--lime);font-weight:800}
  .mphwrap{position:absolute;left:2vw;bottom:2vh;width:46vw;height:23vh;display:flex;flex-direction:column;justify-content:flex-end;pointer-events:none}
  .mph{font-size:16vh;font-weight:800;letter-spacing:-.06em;line-height:.8;text-shadow:0 12px 36px #000}
  .mph em{font-style:normal;font-size:3.4vh;color:var(--lime);margin-left:8px}
  .arrow{font-size:6vh;line-height:1}
  .up{color:#7dff6a}.down{color:#ff5a5a}.same{color:#e7c35a}
  .sub{margin-top:4px;color:rgba(255,255,255,.72);font-size:12px;font-weight:700;letter-spacing:.08em}
</style>
</head>
<body>
<div id="stage">
  <video id="vid" playsinline muted autoplay></video>
  <canvas id="cv"></canvas>
</div>
<div id="hud">
  <div class="top">
    <div class="brand">KICKLAB</div>
    <div class="row">
      <button class="ghost" id="cam">CAMERA</button>
      <button class="ghost" id="arm">ARM</button>
      <button class="ghost" id="unlock">RESET</button>
    </div>
  </div>
  <div class="mphwrap">
    <div class="arrow same" id="arrow">→</div>
    <div class="mph" id="mph">—<em>MPH</em></div>
    <div class="sub" id="meta">SIZE 4</div>
  </div>
  <div class="status"><div><span id="tag">SET THE LINE</span><b id="ready">HOLD</b></div></div>
</div>
<script>
const $ = id => document.getElementById(id);
const vid=$("vid"), cv=$("cv");
const ctx=cv.getContext("2d",{willReadFrequently:true});
const buf=document.createElement("canvas");
const btx=buf.getContext("2d",{willReadFrequently:true});
const AW=480, BALL_FT=0.673, DEFAULT_D=0.06;

const S={
  live:false, phase:"off",
  gx:0.62, gy0:0.55, gy1:0.97,
  drag:false, quiet:0, cool:0,
  path:[], last:null, prev:null,
  scaleD:DEFAULT_D, lastMph:null, still:0
};

function frozen(){ return S.drag || performance.now()<S.quiet; }
function fit(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; }
addEventListener("resize", fit); fit();

function drawCover(c,w,h){
  const vw=vid.videoWidth, vh=vid.videoHeight; if(!vw) return;
  const s=Math.max(w/vw,h/vh), dw=vw*s, dh=vh*s;
  c.save(); c.translate(w,0); c.scale(-1,1);
  c.drawImage(vid,(w-dw)/2,(h-dh)/2,dw,dh); c.restore();
}
function snap(){
  const th=Math.max(200, Math.round(AW*cv.height/cv.width));
  if(buf.width!==AW||buf.height!==th){ buf.width=AW; buf.height=th; }
  drawCover(btx,AW,th);
  return btx.getImageData(0,0,AW,th);
}
function L(r,g,b){ return (r+g+b)/3; }
function grass(r,g,b){ return g>r+12 && g>b+8 && g>48; }
function skin(r,g,b){ return r>98 && g>52 && r>b+10 && r-g<72 && L(r,g,b)<185; }
function seed(r,g,b){
  if(grass(r,g,b)||skin(r,g,b)) return false;
  if(L(r,g,b)>132) return true;
  return r>130 && r>g+16 && r>b+8;
}
function fill(r,g,b){
  if(grass(r,g,b)||skin(r,g,b)) return false;
  if(seed(r,g,b)) return true;
  const l=L(r,g,b);
  return l<90 && Math.abs(r-g)<30 && Math.abs(g-b)<30;
}

function blob(img,x0,x1,y0,y1){
  const {data,width:w,height:h}=img;
  const xa=Math.max(1,(x0*w)|0), xb=Math.min(w-1,(x1*w)|0);
  const ya=Math.max(1,(y0*h)|0), yb=Math.min(h-1,(y1*h)|0);
  let best=null, bestN=8;
  for(let y=ya;y<yb;y+=3){
    for(let x=xa;x<xb;x+=3){
      const i=(y*w+x)*4;
      if(!seed(data[i],data[i+1],data[i+2])) continue;
      let n=0,br=0,sx=0,sy=0,minx=w,maxx=0,miny=h,maxy=0;
      for(let yy=y-14;yy<=y+14;yy+=2){
        if(yy<1||yy>=h-1) continue;
        for(let xx=x-14;xx<=x+14;xx+=2){
          if(xx<1||xx>=w-1) continue;
          const j=(yy*w+xx)*4, r=data[j],g=data[j+1],b=data[j+2];
          if(!fill(r,g,b)) continue;
          n++; sx+=xx; sy+=yy; if(seed(r,g,b)) br++;
          if(xx<minx)minx=xx; if(xx>maxx)maxx=xx;
          if(yy<miny)miny=yy; if(yy>maxy)maxy=yy;
        }
      }
      if(n<=bestN || br<4) continue;
      const dw=(maxx-minx)/w, dh=(maxy-miny)/h, d=Math.max(dw,dh);
      if(d<0.016||d>0.14) continue;
      const asp=dw>dh?dw/Math.max(dh,.001):dh/Math.max(dw,.001);
      if(asp>1.55) continue;
      bestN=n; best={x:sx/n/w,y:sy/n/h,d,n};
    }
  }
  return best;
}

function hud(phase, msg){
  const ready = phase==="armed"||phase==="fly";
  $("ready").textContent = ready ? "KICK" : (phase==="done" ? "HOLD" : "ARM");
  $("tag").textContent = msg || (ready ? "READY" : "SET LINE");
}

function publish(mph){
  mph=Math.round(mph);
  $("mph").innerHTML = mph+"<em>MPH</em>";
  const el=$("arrow");
  if(S.lastMph==null){ el.textContent="→"; el.className="arrow same"; }
  else if(mph>S.lastMph+1){ el.textContent="↑"; el.className="arrow up"; }
  else if(mph<S.lastMph-1){ el.textContent="↓"; el.className="arrow down"; }
  else { el.textContent="→"; el.className="arrow same"; }
  S.lastMph=mph;
  $("meta").textContent = "SIZE 4";
  S.phase="done"; S.cool=performance.now()+1800; S.path=[]; S.last=null;
  $("arm").className="ghost";
  hud("done", mph+" MPH");
}

function score(){
  if(frozen() || S.path.length<2) return false;
  const a=S.path[0], b=S.path[S.path.length-1];
  const dt=b.t-a.t;
  if(dt<0.045 || dt>0.42) return false;
  const left=a.x-b.x;
  if(left<0.035) return false;
  const aspect=innerHeight/innerWidth;
  const fpp=BALL_FT/Math.max(S.scaleD||DEFAULT_D,0.024);
  const dist=Math.hypot(left,(b.y-a.y)*aspect)*fpp;
  if(dist<0.85) return false;
  const mph=(dist/dt)*0.681818;
  if(mph<8 || mph>62) return false;
  publish(mph); return true;
}

function draw(){
  const w=cv.width,h=cv.height;
  ctx.clearRect(0,0,w,h);
  const x=S.gx*w, y0=S.gy0*h, y1=S.gy1*h;
  const ready=S.phase==="armed"||S.phase==="fly";
  const hold=S.phase==="done";
  ctx.lineCap="round";
  ctx.strokeStyle="#fff";
  ctx.globalAlpha = hold ? 0.12 : (ready ? 0.95 : 0.4);
  ctx.lineWidth=(ready?11:7)*devicePixelRatio;
  ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,y1); ctx.stroke();
  ctx.globalAlpha=1;
}

function arm(){
  if(!S.live){ startCam(); return; }
  S.phase="armed"; S.path=[]; S.last=null; S.prev=null; S.still=0;
  $("arm").className="go";
  hud("armed","READY");
}

function reset(){
  S.phase=S.live?"seek":"off";
  S.path=[]; S.last=null; S.prev=null; S.still=0;
  $("arm").className="ghost";
  $("mph").innerHTML="—<em>MPH</em>";
  $("arrow").textContent="→"; $("arrow").className="arrow same";
  hud(S.phase, S.live?"DRAG LINE · ARM":"CAMERA");
}

function loop(){
  if(!S.live) return;
  requestAnimationFrame(loop);
  if(!vid.videoWidth) return;
  const img=snap(), t=performance.now()/1000;
  draw();
  if(frozen()){ S.prev=img; return; }

  if(S.phase==="done"){
    if(performance.now()>S.cool) arm();
    S.prev=img; return;
  }

  const right=blob(img, S.gx+0.02, Math.min(0.95,S.gx+0.28), S.gy0-0.08, S.gy1);
  const mid=blob(img, S.gx-0.08, S.gx+0.06, S.gy0-0.08, S.gy1);
  const left=blob(img, Math.max(0.02,S.gx-0.28), S.gx-0.02, S.gy0-0.12, S.gy1+0.02);
  const hit = mid||left||right;

  if(S.phase==="seek"){
    if(right){
      S.still++; S.scaleD=right.d||S.scaleD; S.last={...right,t};
      if(S.still>=5) arm();
    } else S.still=0;
    S.prev=img; return;
  }

  if(S.phase==="armed" || S.phase==="fly"){
    if(right && !mid && !left){
      S.last={...right,t}; S.scaleD=right.d||S.scaleD;
    }
    const flying = mid||left;
    if(flying){
      S.phase="fly";
      if(S.last) S.path.push({t:S.last.t,x:S.last.x,y:S.last.y});
      S.path.push({t,x:flying.x,y:flying.y});
      if(S.path.length>10) S.path=S.path.slice(-8);
      if(flying.d) S.scaleD=S.scaleD||flying.d;
      hud("fly","READING");
      if(score()){ S.prev=img; return; }
      if(S.path.length && t-S.path[0].t>0.48){
        S.path=[]; S.phase="armed"; hud("armed","READY");
      }
    }
  }
  S.prev=img;
}

function startCam(){
  if(S.live) return;
  navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}}})
    .then(s=>{ vid.srcObject=s; return vid.play(); })
    .then(()=>{
      S.live=true; S.phase="seek";
      $("cam").textContent="LIVE"; $("cam").className="go";
      hud("seek","DRAG LINE · ARM");
      loop();
    }).catch(()=>hud("off","ALLOW CAMERA"));
}

$("cam").onclick=startCam;
$("arm").onclick=arm;
$("unlock").onclick=reset;

function pt(e){ const t=e.touches?e.touches[0]:e; return {x:t.clientX/innerWidth,y:t.clientY/innerHeight}; }
cv.addEventListener("pointerdown", e=>{
  const p=pt(e);
  if(Math.abs(p.x-S.gx)<0.10 && p.y>0.35){
    S.drag="line"; S.quiet=performance.now()+1400; S.path=[];
    try{cv.setPointerCapture(e.pointerId)}catch(_){}
  }
});
addEventListener("pointermove", e=>{
  if(S.drag!=="line") return;
  S.gx=Math.min(0.82, Math.max(0.22, pt(e).x));
  S.quiet=performance.now()+1400;
});
addEventListener("pointerup", ()=>{
  if(S.drag){
    S.quiet=performance.now()+1400; S.path=[]; S.phase="seek";
    $("arm").className="ghost"; hud("seek","ARM WHEN SET");
  }
  S.drag=false;
});
</script>
</body>
</html>
